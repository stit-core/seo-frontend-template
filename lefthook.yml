# Хук без lefthook (checkout без node_modules, удалённый worktree, на который указывает хук) —
# отказ, а не молчаливый пропуск.
assert_lefthook_installed: true

pre-commit:
  # Три --write-хука на один .astro: последовательно, чтобы не перезаписывать друг друга.
  parallel: false
  commands:
    biome:
      glob: "*.{ts,tsx,mts,cts,js,mjs,cjs,astro,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    prettier-astro:
      glob: "src/**/*.astro"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    eslint:
      # Всё, что линтит `pnpm lint`: src, e2e, scripts, конфиги. Фикстуры гейта на гейт — заведомые
      # нарушения со своим eslint.config.js: их линтит только check:gate.
      glob: "*.{ts,tsx,mts,cts,js,mjs,cjs,astro}"
      exclude:
        - ".gate-fixtures/**"
      # --cache: холодный старт ESLint с парсерами фреймворка — самый дорогой шаг гейта.
      run: pnpm eslint --fix --no-error-on-unmatched-pattern --no-warn-ignored --cache {staged_files}
      stage_fixed: true
    plans:
      glob: ".claude/plans/**"
      run: bash scripts/validate-plan.sh

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    check:
      # Префлайт (чистое дерево, пушится HEAD) и pnpm check; refs пушимого — на stdin хука.
      use_stdin: true
      run: bash scripts/pre-push.sh
