pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    eslint:
      glob: "src/**/*.{ts,tsx}"
      run: pnpm eslint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    check:
      run: pnpm check
