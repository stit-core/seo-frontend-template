policies:
  # Значения поля брифа search.ai_bots_policy (../10-playbooks-contracts/schemas/site-brief.schema.json). Правила сборки robots.txt — ниже.
  allow-all:
    name: Пускать всех — поиск, ИИ-ответы и обучение
    robots_txt: |
      User-agent: *
      Disallow: /admin/          # пример: служебные пути сайта, если есть
      Sitemap: https://example.ru/sitemap.xml
    other_controls:
      - "Search Console → Search generative AI: Include (по умолчанию)"
      - "не ставить noarchive, nocache, nosnippet без причины"
    effect: сайт может попадать во все ИИ-ответы; контент может идти в обучение моделей
    tradeoffs: >-
      Вклад в обучение не отзывается задним числом. Для маркетинговых страниц риск мал: их содержание публично и само
      предназначено к распространению.
  allow-search-deny-training:
    name: Пускать поиск и ИИ-ответы, запретить обучение
    robots_txt: |
      User-agent: *
      Disallow: /admin/

      User-agent: GPTBot
      User-agent: ClaudeBot
      User-agent: Google-Extended
      User-agent: Applebot-Extended
      User-agent: meta-externalagent
      User-agent: Amazonbot
      User-agent: MistralAI-Training
      User-agent: CCBot
      Disallow: /

      Sitemap: https://example.ru/sitemap.xml
    other_controls:
      - "Search Console: Include (AI Overviews и AI Mode на обучение не влияют)"
    effect: >-
      Поисковые и ИИ-ответные боты (YandexBot, YandexAdditional, Googlebot, OAI-SearchBot, PerplexityBot,
      Claude-SearchBot, bingbot, Applebot, meta-webindexer, Amzn-SearchBot, DuckAssistBot, MistralAI-Index) и загрузки по
      запросу пользователей разрешены
    tradeoffs: >-
      Google-Extended выключает и заземление в приложениях Gemini (не в Поиске); у Microsoft отдельного запрета обучения нет
      (noarchive убирает и из Copilot); у Яндекса токена обучения нет; CCBot — открытый архив, которым пользуются и
      исследователи. Если заказчику важны ответы приложения Gemini — Google-Extended не запрещать.
  deny-all:
    name: Запретить ИИ всё, кроме классического поиска
    robots_txt: |
      User-agent: *
      Disallow: /admin/

      User-agent: GPTBot
      User-agent: OAI-SearchBot
      User-agent: ChatGPT-User
      User-agent: ClaudeBot
      User-agent: Claude-SearchBot
      User-agent: Claude-User
      User-agent: PerplexityBot
      User-agent: Perplexity-User
      User-agent: Google-Extended
      User-agent: Applebot-Extended
      User-agent: meta-externalagent
      User-agent: meta-webindexer
      User-agent: Amazonbot
      User-agent: Amzn-SearchBot
      User-agent: DuckAssistBot
      User-agent: MistralAI-Index
      User-agent: MistralAI-User
      User-agent: MistralAI-Training
      User-agent: CCBot
      User-agent: YandexAdditional
      Disallow: /

      Sitemap: https://example.ru/sitemap.xml
    other_controls:
      - "Search Console → Search generative AI: Exclude (AI Overviews, AI Mode, ИИ-функции Discover)"
      - "<meta name=\"bingbot\" content=\"noarchive\"> — вне ответов Copilot (в выдаче Bing остаётся)"
      - "<meta name=\"applebot\" content=\"nosnippet\"> — вне ИИ-ответов Siri и Search Apple"
    effect: страница остаётся в поиске Яндекса, Google, Bing, Apple; из ИИ-ответов и обучения — выход там, где платформа это позволяет
    tradeoffs: >-
      Загрузки по запросу пользователя (ChatGPT-User, Perplexity-User, Google-Agent, Google-GeminiNotebook,
      meta-externalfetcher) robots.txt соблюдают не всегда — закрыть только WAF по IP-спискам, и это отрежет агентов,
      которые ведут к заявке.
      Для лидогенерации противоречит цели «чтобы нейронки показывали в ответах» — только по явному решению заказчика.
  ask:
    name: Спросить заказчика
    question: >-
      Разрешать ли нейросетям (1) показывать и цитировать сайт в ответах — Алиса, Google, ChatGPT, Perplexity и (2) учить
      на текстах сайта свои модели? Варианты: всё можно; ответы да, обучение нет; ничего.
    default_if_no_answer: allow-all
    default_rationale: >-
      [практика] Цель системы — видимость в ответах нейросетей; маркетинговые тексты публичны по назначению; модели часто
      отвечают без поиска, из собственных знаний (в аудите Schulte 2026 — 57,8 % повторов ChatGPT без веб-поиска, через
      обзор Martinez 2026), а доля знаний о бренде растёт только через обучение. Исключение — сайты, где текст и есть
      продукт (курсы, платные исследования, авторские базы): там по умолчанию allow-search-deny-training. [спорно]:
      данных о том, что разрешение обучения повышает упоминания бренда, нет.

robots_txt_rules:
  # Техника сборки файла (RFC 9309; Google robots.txt spec 2026-08-31; Яндекс Вебмастер; видео [V:0yedoWKPgo4] и
  # [V:cfIQ_ksB61U]). → 01-seo-google-yandex.md §2.1; 02-geo-ai-search.md §2
  - id: rt-one-file-per-host
    rule: robots.txt — в корне каждого хоста и протокола (https://example.ru/robots.txt), UTF-8, text/plain, код 200; для поддоменов — свой файл
  - id: rt-5xx
    rule: >-
      5xx и сетевые ошибки на robots.txt = «полный запрет» (RFC 9309 §2.3.1.4); Google первые 12 ч не обходит сайт, до 30 дней
      берёт старую копию. 404 = ограничений нет. Проверять код ответа robots.txt при каждом деплое. Страницам (в том числе
      поиску по сайту) ботам тоже не отдавать 5xx и таймауты «чтобы закрыть»: Google решит, что перегрузил сервер, и снизит
      обход всего сайта [V:cfIQ_ksB61U 12:36]
  - id: rt-specific-group-overrides-star
    rule: >-
      Своя группа бота полностью заменяет группу *: служебные Disallow из * повторить в каждой именной группе, иначе
      именной группой с «Allow: /» случайно открываются закрытые пути
  - id: rt-no-css-js-block
    rule: "не запрещать CSS, JS и изображения, нужные для отрисовки — Google и Apple рендерят страницу; Google не рендерит JS из заблокированных файлов; API и XHR — rt-no-api-block"
  - id: rt-no-api-block
    rule: >-
      не закрывать в robots.txt API и XHR, от которых зависит контент (H1, текст, цены): «Do not block any critical resources
      and that includes API calls that are necessary to load content» — иначе Googlebot получает пустую страницу
      [V:0yedoWKPgo4 07:18]; проверка — каждый запрос из сетевого журнала рендера, строящий контент, проходит правила для
      Googlebot и YandexBot. Для SSR и SSG вопрос почти снимается: контент уже в HTML
  - id: rt-disallow-is-not-noindex
    rule: >-
      Disallow не убирает URL из выдачи (показ без сниппета); убрать — meta robots noindex или X-Robots-Tag при открытом
      обходе. На одном URL вместе не работают: за Disallow Google не прочтёт noindex [V:cfIQ_ksB61U 13:18]. Порядок: URL уже в
      индексе → сначала noindex при открытом обходе, после выпадения — Disallow (если нужна экономия обхода); новый шаблон,
      которого нет в индексе, — сразу Disallow
  - id: rt-size
    rule: >-
      до 500 KiB (лимит Google; RFC — не меньше 500 KiB); crawl-delay Google, Apple и Amazon не поддерживают, Яндекс не
      учитывает с 2018-02-22 (скорость — «Скорость обхода сайта» в Вебмастере), Anthropic — поддерживает
  - id: rt-sitemap
    rule: строка Sitemap с абсолютным URL; не рвёт группы
  - id: rt-ads
    rule: AdsBot-Google, AdsBot-Google-Mobile, YaDirectFetcher проверяют посадочные рекламы — не закрывать их поимённо; Disallow для * на них не действует
  - id: rt-cdn-waf
    rule: >-
      Проверить, что CDN и WAF не режут ботов: у Cloudflare «Block AI bots», managed robots.txt и новые умолчания с
      2026-09-15 (многоцелевые Googlebot, Applebot, bingbot блокируются у тех, кто запретил Training); проверка — Search
      Console «Проверка URL» и Вебмастер «Проверка ответа сервера»; geo_probe видит только признаки
  - id: rt-signals-optional
    rule: >-
      Content-Signal (Cloudflare) и Content-Usage (IETF draft-ietf-aipref-attach-05) — необязательны, поддержка ботами не
      подтверждена; Search Console может помечать их «Syntax not understood»
  - id: rt-infinite-spaces
    rule: >-
      Поиск по сайту, календари, аддитивные фильтры и сортировки — бесконечные пространства: Google «will try to crawl all of
      those pages», страницы поиска нагружают базу. Новый сайт — одно широкое Disallow на шаблон (Disallow: /search? ; у
      WordPress — /?s=) в группе * и в каждой именной группе; категории и метки — отдельный открытый шаблон; на странице
      результатов нет ссылок на другие запросы вне закрытого шаблона; не 5xx и не 404 на весь поиск; инструмент удаления
      Search Console — не решение (скрывает около 6 месяцев, обход остаётся) [V:cfIQ_ksB61U 04:16–16:59]. Пустая комбинация
      фильтров — 404 (другой случай). Проверка: /search?q=<случайная строка> закрыт robots.txt или несёт noindex
  - id: rt-cdn-directives-stable
    rule: >-
      Ответ за CDN, кэшем и WAF стабилен: 10–20 запросов подряд → одинаковые код, X-Robots-Tag, meta robots, canonical (в
      разобранном случае ложный noindex приходил примерно на каждый 10-й запрос, и одного плохого ответа хватает, чтобы
      страница выпала из индекса); после смены директив индексации — очистить кэш CDN; при расхождении сравнить заголовки
      хорошего и плохого ответа (Age, X-Cache, Via, CF-Ray) [V:0yedoWKPgo4 13:29–17:33]
  - id: rt-yandex-clean-param
    rule: >-
      Clean-param — только Яндекс (Google не исполняет): Clean-param: p0[&p1&…] [префикс пути]; межсекционная (в любом месте
      файла), регистр учитывается, правило до 500 символов; Disallow того же адреса имеет приоритет — не сочетать, если нужно
      только склеить параметры. utm_*, ysclid, yrclid Яндекс, как правило, удаляет сам (справка приводит их примерами);
      yclid, gclid, openstat, параметры сессий и ref — указывать (Яндекс Вебмастер «Директива Clean-param», 2026-09-24).
      Google — canonical без параметров

brief_mapping:
