# crawlers.yaml — поисковые и ИИ-боты: назначение, управление через robots.txt и meta, проверка подлинности.
# Владелец: site (07-seo-geo-performance-analytics). Только первоисточники платформ; у каждой записи — дата проверки.
# Читают: geo_probe.py (оценка robots.txt по ботам), head-kit.yaml, плейбуки (10-playbooks-contracts) и чек-лист
# (09-ai-generation-evaluation).
# Бриф: поле search.ai_bots_policy (../10-playbooks-contracts/schemas/site-brief.schema.json) → раздел policies ниже.

version: 1.0
checked: 2026-09-24
status: released            # перепроверка — раз в квартал
owner: site
network_note: >-
  Страницы документации зарубежных платформ сняты через выход в ЕС (VPN, Литва), Яндекса — с российского адреса,
  2026-09-24; записи с более поздней датой checked сняты в день проверки. Списки ботов меняются без анонсов:
  перепроверять раз в квартал и перед запуском сайта (doc_url + дата checked).

vocab:
  purpose:
    training: сбор контента для обучения моделей (или токен, которым владелец это разрешает или запрещает)
    search: построение поискового индекса, из которого ИИ-ответы берут и цитируют страницы
    user_fetch: разовая загрузка страницы по запросу человека (чат, агент, «прочитай ссылку»)
    ads: реклама — проверка посадочных страниц объявлений и улучшение рекламных продуктов платформы
    other: превью ссылок, рендеринг, служебные и исследовательские обходы
  kind:
    crawler: обходит сайт сам
    fetcher: загружает URL по действию пользователя
    control-token: токен только для robots.txt; своих запросов не делает, управляет использованием контента другого бота
  respects_robots:
    "yes": платформа пишет, что соблюдает robots.txt
    partial: соблюдает с оговорками (игнорирует группу *, «may not apply», «generally ignores»)
    "no": платформа пишет, что robots.txt не использует
    not-stated: в документации не сказано
  star_group_applies: "применяются ли правила группы «User-agent: *», если своей группы у бота нет (RFC 9309 §2.2.1 — да)"

bots:

  # ---------- Яндекс (приоритет 1) ----------
  - id: yandex-yandexbot
    owner: Яндекс
    user_agent_token: YandexBot
    ua_substring: "YandexBot/3.0"
    purpose: search
    kind: crawler
    respects_robots: "yes"
    star_group_applies: true
    robots_fallback: [Yandex]
    robots_control: "User-agent: YandexBot | Yandex | *  (Яндекс ищет подстроку «Yandex»; группа Yandex отменяет *)"
    on_disallow: страницы не индексируются основным роботом → нет в поиске Яндекса и в ответах Алисы (Алиса AI строит ответ из индекса)
    feeds: [yandex-alice]
    priority: 1
    ip_list_url: null
    verify: rdns
    rdns_suffix: [yandex.ru, yandex.net, yandex.com]
    doc_url: https://yandex.ru/support/webmaster/ru/robot-workings/check-yandex-robots
    checked: 2026-09-24
    notes: >-
      AS13238, AS208722, AS212066; «IP-адреса, которые часто меняются, поэтому их список не разглашается» — проверять
      обратным и прямым DNS или инструментом Вебмастера «Проверка IP-адреса». JS рендерится по бета-опции Вебмастера
      («Рендеринг страниц JavaScript β», по умолчанию «на усмотрение робота»); ресурсы для рендера грузит
      YandexRenderResourcesBot.

  - id: yandex-additional
    owner: Яндекс
    user_agent_token: YandexAdditional
    ua_substring: "YandexAdditional"
    purpose: search
    kind: control-token
    respects_robots: "yes"
    star_group_applies: false
    robots_fallback: []
    robots_control: "User-agent: YandexAdditional\nDisallow: /   (на странице также указан токен YandexAdditionalBot)"
    on_disallow: >-
      контент страницы не показывается в быстрых ответах с YandexGPT и в ответах «Поиска с Алисой»; страница остаётся в
      обычном поиске Яндекса
    feeds: [yandex-alice]
    priority: 1
    ip_list_url: null
    verify: none
    doc_url: https://yandex.ru/support/webmaster/ru/robot-workings/check-yandex-robots
    checked: 2026-09-24
    notes: >-
      Дословно: «Учитывается при обработке robots.txt для ограничения отображения контента страницы в быстрых ответах с
      YandexGPT и в ответах Поиска с Алисой. Применяется к страницам, проиндексированным основным индексирующим роботом
      для поиска. Не совершает запросов для индексирования». Столбец «Учитывает общие правила robots.txt» — «Нет»: запрет для
      * или Yandex Алису не выключает, нужен поимённый токен. Отдельного токена «не обучать модели» Яндекс не публикует.

  - id: yandex-direct-fetcher
    owner: Яндекс
    user_agent_token: YaDirectFetcher
    ua_substring: "YaDirectFetcher/1.0"
    purpose: ads
    kind: crawler
    respects_robots: "no"
    star_group_applies: false
    robots_control: "не управляется: «Робот не использует файл robots.txt»"
    on_disallow: нет эффекта
    feeds: []
    priority: 1
    ip_list_url: null
    verify: rdns
    rdns_suffix: [yandex.ru, yandex.net, yandex.com]
    doc_url: https://yandex.ru/support/webmaster/ru/robot-workings/check-yandex-robots
    checked: 2026-09-24
    notes: >-
      Скачивает целевые страницы объявлений Директа «для проверки их доступности и уточнения тематики». Посадочная для
      Директа должна отдавать 200 и смысловой HTML без входа и без блокировки по UA/IP. Посадочные Директа проверяет и
      YandexMetrika/2.0 (… yabs01) — тоже без robots.txt.

  - id: yandex-render-resources
    owner: Яндекс
    user_agent_token: YandexRenderResourcesBot
    ua_substring: "YandexRenderResourcesBot/1.0"
    purpose: other
    kind: crawler
    respects_robots: partial
    star_group_applies: false
    robots_control: "игнорирует robots.txt для ресурсов, если HTML-страница доступна роботу; не ходит за ресурсами запрещённых страниц"
    on_disallow: —
    feeds: [yandex-alice]
    priority: 2
    ip_list_url: null
    verify: rdns
    rdns_suffix: [yandex.ru, yandex.net, yandex.com]
    doc_url: https://yandex.ru/support/webmaster/ru/robot-workings/check-yandex-robots
    checked: 2026-09-24
    notes: Загружает CSS и JS для рендеринга страниц с JavaScript (бета-рендеринг Вебмастера).

  - id: yandex-spravbot
    owner: Яндекс
    user_agent_token: YandexSpravBot
    ua_substring: "YandexSpravBot/1.0"
    purpose: other
    kind: crawler
    respects_robots: "yes"
    star_group_applies: true
    robots_control: "User-agent: YandexSpravBot"
    on_disallow: Яндекс Бизнес не сможет сверить сайт организации
    feeds: [yandex-alice]
    priority: 2
    ip_list_url: null
    verify: rdns
    rdns_suffix: [yandex.ru, yandex.net, yandex.com]
    doc_url: https://yandex.ru/support/webmaster/ru/robot-workings/check-yandex-robots
    checked: 2026-09-24
    notes: Робот Яндекс Бизнеса (карточка организации — сущность для карт и ответов).

  # ---------- Google (приоритет 1) ----------
  - id: google-googlebot
    owner: Google
    user_agent_token: Googlebot
    ua_substring: "Googlebot/2.1"
    purpose: search
    kind: crawler
    respects_robots: "yes"
    star_group_applies: true
    robots_control: "User-agent: Googlebot (Smartphone и Desktop — один токен)"
    on_disallow: >-
      страница не обходится → нет в Поиске и, как следствие, в AI Overviews и AI Mode (условие — «indexed and eligible to
      be shown in Google Search with a snippet»); URL без обхода может показаться в выдаче без сниппета
    other_controls:
      - "Search Console → Настройки → Search generative AI: Include (по умолчанию) | Exclude | Inherit — исключает сайт из AI Overviews, AI Mode и генеративных функций Discover, не влияет на обучение (для всех сайтов с 2026-08-31)"
      - "meta robots nosnippet, max-snippet, data-nosnippet, noindex — ограничивают и ИИ-функции, и обычный сниппет"
    feeds: [google-ai]
    priority: 1
    ip_list_url: https://developers.google.com/static/crawling/ipranges/common-crawlers.json
    verify: ip-list+rdns
    rdns_suffix: [googlebot.com, google.com, googleusercontent.com]
    doc_url: https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers
    checked: 2026-09-24
    notes: >-
      Googlebot читает первые 2 МБ несжатого HTML (и каждого ресурса отдельно), PDF — 64 МБ (страница Googlebot, обн.
      2026-02-03); «the majority of Googlebot crawl requests will be made using the mobile crawler». JS рендерит в
      отдельной очереди (headless Chromium). crawl-delay не поддерживает. Документация краулеров переехала в
      developers.google.com/crawling/ (301 со старых адресов).

  - id: google-extended
    owner: Google
    user_agent_token: Google-Extended
    ua_substring: null
    purpose: training
    kind: control-token
    respects_robots: "yes"
    star_group_applies: true
    robots_control: "User-agent: Google-Extended\nDisallow: /"
    on_disallow: >-
      контент не используется для обучения будущих моделей Gemini и для заземления (grounding) в приложениях Gemini и в
      Grounding with Google Search на Vertex AI; «does not impact a site's inclusion in Google Search nor is it used as a
      ranking signal»
    feeds: []
    priority: 1
    ip_list_url: null
    verify: none
    doc_url: https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers#google-extended
    checked: 2026-09-24
    notes: >-
      Своего UA нет («used in a control capacity»). Запрет обучения у Google одновременно выключает заземление в
      приложениях Gemini — компромисс для политики allow-search-deny-training. На AI Overviews и AI Mode не влияет
      (для них — Search generative AI control в Search Console).

  - id: google-adsbot
    owner: Google
    user_agent_token: AdsBot-Google
    ua_substring: "AdsBot-Google"
    purpose: ads
    kind: crawler
    respects_robots: partial
    star_group_applies: false
    robots_control: "User-agent: AdsBot-Google и AdsBot-Google-Mobile — только поимённо; «The global user agent (*) is ignored»"
    on_disallow: Google Ads не сможет проверить качество посадочной (landing page experience)
    feeds: []
    priority: 1
    ip_list_url: https://developers.google.com/static/crawling/ipranges/special-crawlers.json
    verify: ip-list+rdns
    rdns_suffix: [google.com]
    doc_url: https://developers.google.com/crawling/docs/crawlers-fetchers/google-special-case-crawlers
    checked: 2026-09-24
    notes: >-
      Посадочная под контекстную рекламу не должна запрещать AdsBot поимённо. Disallow для * его не касается. Мобильный
      вариант — токен AdsBot-Google-Mobile.

  - id: google-agent
    owner: Google
    user_agent_token: Google-Agent
    ua_substring: "Google-Agent"
    purpose: user_fetch
    kind: fetcher
    respects_robots: partial
    star_group_applies: false
    robots_control: "user-triggered fetchers «generally ignore robots.txt rules»"
    on_disallow: нет гарантированного эффекта
    feeds: [google-ai]
    priority: 2
    ip_list_url: https://developers.google.com/static/crawling/ipranges/user-triggered-agents.json
    verify: ip-list
    doc_url: https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers
    checked: 2026-10-06
    notes: >-
      «Used by agents hosted on Google infrastructure to navigate the web and perform actions upon user request».
      Агенты читают скриншоты, DOM и дерево доступности (ai-optimization-guide 2026-07-10) — формы и CTA должны работать
      семантически. Часть запросов подписана Web Bot Auth (emerging web-bot-auth).

  - id: google-geminianotebook
    owner: Google
    user_agent_token: Google-GeminiNotebook
    ua_substring: "Google-GeminiNotebook"
    purpose: user_fetch
    kind: fetcher
    respects_robots: partial
    star_group_applies: false
    robots_control: "user-triggered fetchers «generally ignore robots.txt rules»"
    on_disallow: нет гарантированного эффекта
    feeds: []
    priority: 3
    ip_list_url: https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers-google.json
    verify: ip-list+rdns
    rdns_suffix: [google.com, googleusercontent.com]
    doc_url: https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers
    checked: 2026-10-06
    notes: >-
      «Requests individual URLs that Gemini Notebook users have provided as sources for their projects»: страница —
      источник заметок пользователя, а не ИИ-ответов поиска. Токен в UA мобильной и десктопной версий —
      «compatible; Google-GeminiNotebook». IP — в файлах user-triggered-fetchers-google.json (rDNS google-proxy-…google.com)
      и user-triggered-fetchers.json (rDNS …gae.googleusercontent.com): какой из них у этого fetcher'а, Google не уточняет.
      В политиках robots.txt не перечисляется: правила robots.txt он, как правило, не исполняет (policies.deny-all.tradeoffs).

  - id: google-googleother
    owner: Google
    user_agent_token: GoogleOther
    ua_substring: "GoogleOther"
    purpose: other
    kind: crawler
    respects_robots: "yes"
    star_group_applies: true
    robots_control: "User-agent: GoogleOther"
    on_disallow: «don't affect any specific product»
    feeds: []
    priority: 3
    ip_list_url: https://developers.google.com/static/crawling/ipranges/common-crawlers.json
    verify: ip-list+rdns
    rdns_suffix: [googlebot.com, google.com]
    doc_url: https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers
    checked: 2026-09-24
    notes: Общий краулер для разовых обходов, исследований и разработки Google. Есть GoogleOther-Image и GoogleOther-Video.

  - id: google-cloudvertexbot
    owner: Google
    user_agent_token: Google-CloudVertexBot
    ua_substring: "Google-CloudVertexBot"
    purpose: other
    kind: crawler
    respects_robots: "yes"
    star_group_applies: true
    robots_control: "User-agent: Google-CloudVertexBot"
    on_disallow: не строит агентов Vertex AI по запросу владельца сайта; «no effect on Google Search»
    feeds: []
    priority: 3
    ip_list_url: https://developers.google.com/static/crawling/ipranges/common-crawlers.json
    verify: ip-list+rdns
    rdns_suffix: [googlebot.com, google.com]
    doc_url: https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers
    checked: 2026-09-24
    notes: Обходит сайт только по заказу его владельца (Vertex AI Agents).

  # ---------- OpenAI (приоритет 2) ----------
  - id: openai-oai-searchbot
    owner: OpenAI
    user_agent_token: OAI-SearchBot
    ua_substring: "OAI-SearchBot/"
    purpose: search
    kind: crawler
    respects_robots: "yes"
    star_group_applies: true
    robots_control: "User-agent: OAI-SearchBot"
    on_disallow: >-
      «Sites that are opted out of OAI-SearchBot will not be shown in ChatGPT search answers, though can still appear as
      navigational links»
    feeds: [chatgpt-search]
    priority: 2
    ip_list_url: https://openai.com/searchbot.json
    verify: ip-list
    doc_url: https://developers.openai.com/api/docs/bots
    checked: 2026-09-24
    notes: >-
      Изменение robots.txt доходит до поиска примерно за 24 ч. При запросе robots.txt добавляет в UA маркер «robots.txt;».
      Если разрешены и OAI-SearchBot, и GPTBot, OpenAI может использовать один обход для обеих целей.

  - id: openai-gptbot
    owner: OpenAI
    user_agent_token: GPTBot
    ua_substring: "GPTBot/"
    purpose: training
    kind: crawler
    respects_robots: "yes"
    star_group_applies: true
    robots_control: "User-agent: GPTBot"
    on_disallow: «indicates a site's content should not be used in training generative AI foundation models»
    feeds: []
    priority: 2
    ip_list_url: https://openai.com/gptbot.json
    verify: ip-list
    doc_url: https://developers.openai.com/api/docs/bots
    checked: 2026-09-24
    notes: Настройка независима от OAI-SearchBot («Each setting is independent of the others»).

  - id: openai-chatgpt-user
    owner: OpenAI
    user_agent_token: ChatGPT-User
    ua_substring: "ChatGPT-User/"
    purpose: user_fetch
    kind: fetcher
    respects_robots: partial
    star_group_applies: true
    robots_control: "«Because these actions are initiated by a user, robots.txt rules may not apply»"
    on_disallow: >-
      не гарантирован; «ChatGPT-User is not used to determine whether content may appear in Search» — выход из поиска
      ChatGPT делается через OAI-SearchBot
    feeds: [chatgpt-search]
    priority: 2
    ip_list_url: https://openai.com/chatgpt-user.json
    verify: ip-list
    doc_url: https://developers.openai.com/api/docs/bots
    checked: 2026-09-24
    notes: Загрузки по действиям пользователя в ChatGPT и Custom GPTs (включая GPT Actions); автоматически веб не обходит.

  - id: openai-oai-adsbot
    owner: OpenAI
    user_agent_token: OAI-AdsBot
    ua_substring: "OAI-AdsBot/"
    purpose: ads
    kind: crawler
    respects_robots: not-stated
    star_group_applies: true
    robots_control: "в документации не описано"
    on_disallow: неизвестно; рекламу в ChatGPT без проверки посадочной, вероятно, не пропустят (не проверено)
    feeds: []
    priority: 3
    ip_list_url: https://openai.com/adsbot.json
    verify: ip-list
    doc_url: https://developers.openai.com/api/docs/bots
    checked: 2026-09-24
    notes: >-
      Проверяет безопасность посадочных страниц объявлений в ChatGPT и может брать с них контент для подбора показа;
      «only visits pages submitted as ads»; данные не идут в обучение.

  # ---------- Perplexity (приоритет 2) ----------
  - id: perplexity-perplexitybot
    owner: Perplexity
    user_agent_token: PerplexityBot
    ua_substring: "PerplexityBot/"
    purpose: search
    kind: crawler
    respects_robots: "yes"
    star_group_applies: true
    robots_control: "User-agent: PerplexityBot"
    on_disallow: сайт не индексируется для поисковых ответов Perplexity
    feeds: [perplexity]
    priority: 2
    ip_list_url: https://www.perplexity.com/perplexitybot.json
    verify: ip-list
    doc_url: https://docs.perplexity.ai/guides/bots
    checked: 2026-09-24
    notes: >-
      «Not used to crawl content for AI foundation models». IP-список отдаётся редиректом на perplexity.ai. Для WAF
      Perplexity советует правило «UA содержит PerplexityBot И IP из списка → Allow».

  - id: perplexity-perplexity-user
    owner: Perplexity
    user_agent_token: Perplexity-User
    ua_substring: "Perplexity-User/"
    purpose: user_fetch
    kind: fetcher
    respects_robots: partial
    star_group_applies: true
    robots_control: "«Since a user requested the fetch, this fetcher generally ignores robots.txt rules»"
    on_disallow: не гарантирован; закрыть можно только на уровне WAF по IP-списку
    feeds: [perplexity]
    priority: 2
    ip_list_url: https://www.perplexity.com/perplexity-user.json
    verify: ip-list
    doc_url: https://docs.perplexity.ai/guides/bots
    checked: 2026-09-24
    notes: Загружает страницу, когда пользователь спрашивает Perplexity, и может дать на неё ссылку в ответе; не для обучения.

  # ---------- Anthropic (приоритет 3; в брифе — ai_answers: claude) ----------
  - id: anthropic-claude-searchbot
    owner: Anthropic
    user_agent_token: Claude-SearchBot
    ua_substring: "Claude-SearchBot"
    purpose: search
    kind: crawler
    respects_robots: "yes"
    star_group_applies: true
    robots_control: "User-agent: Claude-SearchBot"
    on_disallow: «prevents our system from indexing your content for search optimization, which may reduce your site's visibility and accuracy in user search results»
    feeds: [claude]
    priority: 3
    ip_list_url: https://claude.com/crawling/bots.json
    verify: ip-list
    doc_url: https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler
    checked: 2026-09-24
    notes: Один IP-список на всех ботов Anthropic. UA-строк на странице нет. Поддержан Crawl-delay; CAPTCHA не обходят.

  - id: anthropic-claudebot
    owner: Anthropic
    user_agent_token: ClaudeBot
    ua_substring: "ClaudeBot"
    purpose: training
    kind: crawler
    respects_robots: "yes"
    star_group_applies: true
    robots_control: "User-agent: ClaudeBot"
