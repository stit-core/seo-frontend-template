google_unsupported_rules:
  # Поля robots.txt, которые Google распознаёт, но не исполняет: для Googlebot такие строки пусты. → 01-seo-google-yandex.md §2.1
  source: https://github.com/google/robotstxt/blob/master/reporting_robots.cc
  list_name: kUnsupportedTags
  commit: 4af32e5
  commit_date: 2026-02-19
  commit_author: Gary Illyes (Google)
  checked: 2026-09-24
  quote: >-
    «The kUnsupportedTags tags are popular tags in robots.txt files, but Google doesn't use them for anything. Other search
    engines may, however»; список пополняется по данным HTTP Archive (custom_metrics.robots_txt, самые частые поля)
  history: >-
    Коммит 4af32e5 добавил content-signal, content-usage, domain, request-rate, revisit-after, visit-time («identified as
    frequently used… via HTTP Archive»); clean-param, crawl-delay, host, noarchive, nofollow, noindex были в списке раньше.
    [V:DchuJS7JWvk 03:20]
  fields:
    - {field: clean-param, others: "Яндекс — склейка GET-параметров (rt-yandex-clean-param)", decision: "писать для Яндекса; Google — canonical без параметров"}
    - {field: content-signal, others: "Cloudflare Content Signals; поддержка ИИ-ботами не подтверждена", decision: "сами не пишем (emerging)"}
    - {field: content-usage, others: "IETF draft-ietf-aipref-attach-05 — черновик; поддержка не подтверждена", decision: "опционально, [не проверено]"}
    - {field: crawl-delay, others: "Anthropic — поддерживает; Яндекс — не учитывает с 2018-02-22; Apple, Amazon — нет", decision: "нагрузку ограничивать сервером и настройками кабинетов"}
    - {field: domain, others: "у платформ из bots не документировано", decision: "не писать"}
    - {field: host, others: "у платформ из bots не документировано (страницы …/robot-workings/host у Яндекса нет — 404, 2026-09-24)", decision: "не писать; главное зеркало — 301"}
    - {field: noarchive, others: "как строка robots.txt — не документировано; как meta robots — Bing (вне ответов Copilot), Amazon (не для обучения)", decision: "только meta robots, по политике"}
    - {field: nofollow, others: "как строка robots.txt — не документировано", decision: "meta robots или rel у ссылки"}
    - {field: noindex, others: "как строка robots.txt — не документировано", decision: "только meta robots или X-Robots-Tag при открытом обходе (rt-disallow-is-not-noindex)"}
    - {field: request-rate, others: "у платформ из bots не документировано", decision: "не писать"}
    - {field: revisit-after, others: "у платформ из bots не документировано", decision: "не писать"}
    - {field: visit-time, others: "у платформ из bots не документировано", decision: "не писать"}
  supported_by_google: [user-agent, allow, disallow, sitemap]

emerging:
  # Файлы и протоколы «для ИИ» вне robots.txt и meta — статус на дату checked записи. Решения базы — 02-geo-ai-search.md
  # §5, §8.4.
  - id: llms-txt
    what: "/llms.txt — Markdown: H1 (обязателен), цитата-резюме, разделы H2 со списками ссылок, раздел Optional; в корне или в подпапке"
    spec: "llmstxt.org, версия 2 (J. Howard) — предложение, не стандарт"
    readers: >-
      Google Поиск не использует: «won't negatively or positively impact your visibility or rankings» (журнал Search Central,
      2026-06-15), в списке «можно игнорировать» (ai-optimization-guide, 2026-07-10); в документации ботов OpenAI, Anthropic,
      Perplexity, Яндекса, Bing не упомянут (сырые копии 00-sources, 2026-09-24); по словам автора — читают агенты-программисты
      в документации ПО
    lighthouse: "аудит «llms.txt» (Agentic browsing, обн. 2026-05-05): ошибка сервера — флаг; 404 — N/A («providing the file is optional at the moment»)"
    adoption: "Web Almanac 2025 — валиден у 2,13 % сайтов (десктоп), 39,6 % файлов создал плагин All in One SEO; замер корпуса text — ≈ 25 из 97 хостов; замер посадочных — 20 из 69 страниц (RU 3 из 33)"
    evidence_of_benefit: "нет; цифры логов из вторичных пересказов не подтверждены первоисточником — [вендор-GEO]"
    decision: "маркетинговый сайт — по умолчанию нет; по просьбе заказчика — собирать из карты сайта и facts; документация и API — да"
    check: "geo_probe.py: llms.valid, llms.is_html, llms.redirected_away; 200 text/plain или 404 — не 5xx и не HTML-заглушка"
    doc_url: https://llmstxt.org/
    checked: 2026-09-24
  - id: llms-full-txt
    what: "/llms-full.txt — весь текст сайта или документации одним файлом"
    spec: "в тексте llmstxt.org v2 не определён; практика генераторов документации"
    decision: "только для документации; маркетинговому сайту — нет"
    check: "geo_probe.py: llms_full.valid"
    checked: 2026-09-24
  - id: markdown-alternates
    what: "Markdown-версия страницы по тому же адресу + .md (page.html.md или page.md); <link rel=\"alternate\" type=\"text/markdown\">; rel=\"describedby\" → llms.txt; или заголовок Link"
    spec: "llmstxt.org v2"
    readers: "платформами не документировано; Google — «Rewriting content just for AI systems» и «special markup» можно игнорировать"
    adoption: "замер корпуса text — 0 из 112 страниц"
    decision: "только документация разработчиков; маркетинговым страницам — нет: две версии расходятся [V:Vkn3R6DUJ34 14:19–15:07], «developer bias» [V:Vkn3R6DUJ34 21:08–22:28]"
    checked: 2026-09-24
  - id: webmcp
    what: "инструменты сайта для браузерного агента: декларативные в HTML и императивные в JS"
    spec: "предложение веб-стандарта; в Chrome — эксперимент с origin trial (web.dev, обн. 2026-04-01); ранний показ — блог Chrome for Developers 2026-02-10"
    readers: "браузерные агенты Chrome; Lighthouse проверяет через CDP-домен WebMCP (Agentic browsing, 2026-05-05)"
    decision: "по умолчанию нет; кандидаты — запись, калькулятор, подбор тарифа после выхода из эксперимента"
    doc_url: https://web.dev/articles/ai-agent-site-ux
    checked: 2026-09-24
  - id: content-signal
    what: "строка robots.txt Content-signal: search=yes|no, ai-input=yes|no, ai-train=yes|no; тест use=immediate|reference|full"
    spec: "Cloudflare (managed robots.txt, обн. 2026-08-03); заявлена как оговорка прав по ст. 4 Директивы ЕС 2019/790"
    readers: "Google не исполняет (kUnsupportedTags, 2026-02-19); поддержка ИИ-ботами не подтверждена; Search Console может показать «Syntax not understood»"
    adoption: "замер корпуса text — 3 хоста (intercom, zapier, megaplan), замер посадочных — 2 страницы; все ai-train=yes"
    decision: "сами не пишем; сайт за Cloudflare — сверить managed-блок с search.ai_bots_policy"
    doc_url: https://developers.cloudflare.com/bots/additional-configurations/managed-robots-txt/
    checked: 2026-09-24
  - id: content-usage
    what: "HTTP-заголовок Content-Usage: train-ai=n и строка robots.txt Content-Usage: [путь] train-ai=n внутри группы"
    spec: "IETF AIPREF: draft-ietf-aipref-vocab-08 (2026-09-13), draft-ietf-aipref-attach-05 (G. Illyes, M. Thomson; 2026-08-19; «Updates: 9309 (if approved)») — черновики"
    readers: "поддержка краулерами не подтверждена; Google строку пока не исполняет (kUnsupportedTags)"
    decision: "опционально, [не проверено]; для ЕС-профиля — вопрос site 08"
    doc_url: https://datatracker.ietf.org/doc/draft-ietf-aipref-attach/
    checked: 2026-09-24
  - id: ucp
    what: "UCP (ucp.dev) — протокол агентов для покупок"
    readers: "упомянут Google в ai-optimization-guide (2026-07-10)"
    decision: "вне рамок базы (магазины)"
    checked: 2026-09-24
  - id: markdown-for-agents
    what: >-
      Cloudflare «Markdown for Agents»: на запрос с Accept: text/markdown edge сам переводит HTML страницы в Markdown;
      в ответе content-type: text/markdown, x-markdown-tokens, vary: accept и content-signal — если сервер не ставит
      свой, Cloudflare пишет ai-train=yes, search=yes, ai-input=yes
    spec: >-
      функция Cloudflare (changelog 2026-02-12, документация обн. 2026-07-13): тарифы Pro, Business, Enterprise и SSL for
      SaaS; включается в AI Crawl Control, по умолчанию выключена; переводит только HTML, ответ сервера — до 2 МБ
    readers: >-
      ИИ-системы и агенты, которые просят text/markdown в заголовке Accept (описание Cloudflare); документированных
      читателей среди ботов раздела bots база не знает
    decision: >-
      маркетинговому сайту — не включать, как и markdown-alternates: читатели не документированы, у страницы одна версия
      для людей и машин (02-geo-ai-search.md §5.4). Сайт за Cloudflare с включённой функцией ставит свой заголовок
      content-signal по search.ai_bots_policy: умолчание Cloudflare разрешает обучение и расходится с политиками
      allow-search-deny-training и deny-all
    doc_url: https://developers.cloudflare.com/fundamentals/reference/markdown-for-agents/
    checked: 2026-10-06
  - id: web-bot-auth
    what: >-
      подпись запросов бота: HTTP Message Signatures (RFC 9421) — заголовки Signature, Signature-Input и Signature-Agent;
      открытые ключи — в каталоге /.well-known/http-message-signatures-directory владельца бота
    spec: >-
      черновик IETF; Google — эксперимент (документация 2026-05-04): подписана часть запросов Google-Agent, заголовок
      Signature-Agent: g="https://agent.bot.goog", ключи — https://agent.bot.goog/.well-known/http-message-signatures-directory
    readers: "проверяет сервер, CDN или WAF сайта"
    decision: >-
      сайту делать ничего не нужно: подлинность ботов проверяется по verify записей bots (IP-списки, обратный DNS), подпись —
      дополнительный признак у WAF, который её умеет; Google советует проверку по IP, DNS и UA не снимать, пока подписан не
      весь трафик
    doc_url: https://developers.google.com/crawling/docs/crawlers-fetchers/web-bot-auth
    checked: 2026-10-06

