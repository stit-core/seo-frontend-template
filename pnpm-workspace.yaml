# Настройки pnpm — здесь, а не в .npmrc и package.json#pnpm: этот файл читают pnpm 10.34, 11 и 12.
# В .npmrc остаются только реестр и токены.

# Проект один — корень. Без списка pnpm считает проектом каждый package.json в подкаталогах
# (исследования в docs/research) и печатает их предупреждения в каждом шаге гейта.
packages:
  - .

# Скрипты установки — только у этих пакетов; у остальных их нет или они не нужны (бинарник
# unrs-resolver приходит optional-пакетом, его postinstall лишь перепроверяет).
allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: false

# Версия моложе трёх суток не ставится: столько npm даёт автору снять релиз, а реестру — отозвать
# вредоносный.
minimumReleaseAge: 4320

# Конфликт peer — ошибка установки; известный и безвредный — строкой ниже, с причиной.
strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    # tsconfck (через плагин Steiger) объявляет TypeScript ^5, а читает только tsconfig — гейт на 6 зелёный.
    tsconfck>typescript: '6'

# Исправленную версию транзитивной зависимости не пускает точный пин её владельца — подмена с причиной.
# Селектор — только уязвимые версии: когда владелец поднимет пин сам, подмена не сработает, и цикл
# обновлений её снимет (docs/stack/_templates/dependencies.md § Обновления).
overrides:
  # handlebars 4.7.9 — точный пин eslint-plugin-boundaries 7.2.0, последней версии плагина; две critical
  # (GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f) закрыты в 4.7.10.
  'handlebars@<4.7.10': 4.7.10

# Уязвимость без исправленной версии — строкой с причиной: почему она в этом сайте не эксплуатируется.
# Цикл обновлений пересматривает строки (docs/stack/_templates/dependencies.md).
auditConfig:
  ignoreGhsas:
    # braces ≤ 3.0.3, исправления нет: micromatch линтера eslint-plugin-boundaries разбирает шаблоны
    # путей из eslint.config.js.
    - GHSA-vfj7-8cjw-p6xm
