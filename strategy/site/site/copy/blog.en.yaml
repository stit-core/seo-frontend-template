# Тексты списка блога проекта шаблона site-template на английском — copy deck второго языка: те же id
# секций и слотов, что у copy/blog.yaml.
copy_deck:
  version: 1
  date: '2026-10-17'
  site: site-template
  product_name: ssr-frontend-template
  lang: en
  source_lang: ru
  source_ref: blog.yaml
  adaptation: {mode: adaptation}
  facts_ref: ../../../facts.en.yaml
  page_plan_ref: ../plans/blog.yaml
  jurisdiction: ru
  legal_category: [general]
  authors: [template maintainer]
  pages:
    - page_id: blog
      page_type: blog-index-page
      status: assumed
      meta:
        title: ssr-frontend-template blog on indexable sites
        description: >-
          Short notes on content sites: prerendering, zero JavaScript, honest status codes, canonical and
          hreflang, images, sitemaps and one image for every environment
        fact_ids: []
      sections:
        - section_id: header
          section_role: header
          block: header
          slots:
            - slot_id: nav-link-1
              slot_type: nav-label
              site_slot_id: nav-link
              variants:
                - {id: a, text: Blog, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-link-2
              slot_type: nav-label
              site_slot_id: nav-link
              variants:
                - {id: a, text: About, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-link-3
              slot_type: nav-label
              site_slot_id: nav-link
              variants:
                - {id: a, text: Contacts, status: assumed, source: ai-self}
              chosen: a
        - section_id: hero
          section_role: hero
          block: hero-text
          slots:
            - slot_id: headline
              slot_type: headline
              variants:
                - {id: a, text: 'Blog on fast, indexable sites', status: assumed, source: ai-self}
              chosen: a
            - slot_id: subheadline
              slot_type: subheadline
              variants:
                - id: a
                  text: >-
                    Short notes on building fast, indexable sites: rendering, JavaScript, search and deployment.
                  status: assumed
                  source: ai-self
              chosen: a
            - slot_id: cta-label
              slot_type: cta-label
              variants:
                - {id: a, text: Send a request, status: assumed, source: ai-self}
              chosen: a
        - section_id: related
          section_role: related
          block: article-cards
          slots:
            - slot_id: title
              slot_type: section-title
              variants:
                - {id: a, text: All notes, status: assumed, source: ai-self}
              chosen: a
        - section_id: footer
          section_role: footer
          block: footer
          slots:
            - slot_id: legal
              slot_type: footer-legal
              variants:
                - {id: a, text: 'Primer LLC, OGRN 1000000000001, INN 7700000000', status: assumed, source: fact}
              chosen: a
              fact_ids: ['fact:company-name', 'fact:company-ogrn', 'fact:company-inn']
            - slot_id: privacy-label
              slot_type: nav-label
              variants:
                - {id: a, text: Personal data policy, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-1-label
              slot_type: nav-label
              site_slot_id: nav.label
              group: nav-1
              variants:
                - {id: a, text: Blog, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-2-label
              slot_type: nav-label
              site_slot_id: nav.label
              group: nav-2
              variants:
                - {id: a, text: About, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-3-label
              slot_type: nav-label
              site_slot_id: nav.label
              group: nav-3
              variants:
                - {id: a, text: Contacts, status: assumed, source: ai-self}
              chosen: a
