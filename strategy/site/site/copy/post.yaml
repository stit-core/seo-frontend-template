# Тексты шаблона записи блога проекта шаблона site-template — copy deck v1 базы strategy (kb/text/
# 10-templates-recipes/copy-deck.schema.json): тексты шаблона по id плана plans/post.yaml; слоты записи и
# мету страницы даёт запись коллекции.
copy_deck:
  version: 1
  date: '2026-10-16'
  site: site-template
  product_name: ssr-frontend-template
  lang: ru
  facts_ref: ../../../facts.yaml
  page_plan_ref: ../plans/post.yaml
  jurisdiction: ru
  legal_category: [general]
  authors: [исполнитель шаблона]
  pages:
    - page_id: post
      page_type: article-page
      status: assumed
      sections:
        - section_id: header
          section_role: header
          block: header
          slots:
            - slot_id: nav-link-1
              slot_type: nav-label
              site_slot_id: nav-link
              variants:
                - {id: a, text: Блог, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-link-2
              slot_type: nav-label
              site_slot_id: nav-link
              variants:
                - {id: a, text: О компании, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-link-3
              slot_type: nav-label
              site_slot_id: nav-link
              variants:
                - {id: a, text: Контакты, status: assumed, source: ai-self}
              chosen: a
        - section_id: breadcrumbs
          section_role: header
          block: breadcrumbs
          slots:
            - slot_id: crumb-1-label
              slot_type: nav-label
              site_slot_id: crumb.label
              group: crumb-1
              variants:
                - {id: a, text: Главная, status: assumed, source: ai-self}
              chosen: a
            - slot_id: crumb-2-label
              slot_type: nav-label
              site_slot_id: crumb.label
              group: crumb-2
              variants:
                - {id: a, text: Блог, status: assumed, source: ai-self}
              chosen: a
        - section_id: related
          section_role: related
          block: related-links
          slots:
            - slot_id: title
              slot_type: section-title
              variants:
                - {id: a, text: Читайте также, status: assumed, source: ai-self}
              chosen: a
        - section_id: footer
          section_role: footer
          block: footer
          slots:
            - slot_id: legal
              slot_type: footer-legal
              variants:
                - {id: a, text: 'ООО «Пример», ОГРН 1000000000001, ИНН 7700000000', status: assumed, source: fact}
              chosen: a
              fact_ids: ['fact:company-name', 'fact:company-ogrn', 'fact:company-inn']
            - slot_id: privacy-label
              slot_type: nav-label
              variants:
                - {id: a, text: Обработка персональных данных, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-1-label
              slot_type: nav-label
              site_slot_id: nav.label
              group: nav-1
              variants:
                - {id: a, text: Блог, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-2-label
              slot_type: nav-label
              site_slot_id: nav.label
              group: nav-2
              variants:
                - {id: a, text: О компании, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-3-label
              slot_type: nav-label
              site_slot_id: nav.label
              group: nav-3
              variants:
                - {id: a, text: Контакты, status: assumed, source: ai-self}
              chosen: a
