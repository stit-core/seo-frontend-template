# Тексты страницы 404 проекта шаблона site-template на английском — copy deck второго языка: те же id секций и
# слотов, что у copy/not-found.yaml.
copy_deck:
  version: 1
  date: '2026-10-16'
  site: site-template
  product_name: ssr-frontend-template
  lang: en
  source_lang: ru
  source_ref: not-found.yaml
  adaptation: {mode: adaptation}
  facts_ref: ../../../facts.en.yaml
  page_plan_ref: ../plans/not-found.yaml
  jurisdiction: ru
  legal_category: [general]
  authors: [template maintainer]
  pages:
    - page_id: not-found
      page_type: not-found-page
      status: assumed
      meta:
        title: Page not found
        description: >-
          There is no such page on the site: the address has changed or has a typo. Start from the home page or open
          the section you need.
        fact_ids: []
      sections:
        - section_id: header
          section_role: header
          block: header
          slots:
            - slot_id: nav-link-1
              slot_type: nav-label
              site_slot_id: nav-link
              variants:
                - {id: a, text: Blog, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-link-2
              slot_type: nav-label
              site_slot_id: nav-link
              variants:
                - {id: a, text: About, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-link-3
              slot_type: nav-label
              site_slot_id: nav-link
              variants:
                - {id: a, text: Contacts, status: assumed, source: ai-self}
              chosen: a
        - section_id: not-found
          section_role: not-found
          block: not-found
          slots:
            - slot_id: title
              slot_type: headline
              variants:
                - {id: a, text: Page not found, status: assumed, source: ai-self}
              chosen: a
            - slot_id: body
              slot_type: body
              variants:
                - id: a
                  text: >-
                    There is no such page on the site — it may have moved, or the address has a typo. Start from the
                    home page or open the section you need.
                  status: assumed
                  source: ai-self
              chosen: a
            - slot_id: cta-label
              slot_type: cta-label
              variants:
                - {id: a, text: Home, status: assumed, source: ai-self}
              chosen: a
            - slot_id: route-1-label
              slot_type: nav-label
              site_slot_id: route.label
              group: route-1
              variants:
                - {id: a, text: Blog, status: assumed, source: ai-self}
              chosen: a
            - slot_id: route-2-label
              slot_type: nav-label
              site_slot_id: route.label
              group: route-2
              variants:
                - {id: a, text: About, status: assumed, source: ai-self}
              chosen: a
            - slot_id: route-3-label
              slot_type: nav-label
              site_slot_id: route.label
              group: route-3
              variants:
                - {id: a, text: Contacts, status: assumed, source: ai-self}
              chosen: a
        - section_id: footer
          section_role: footer
          block: footer
          slots:
            - slot_id: legal
              slot_type: footer-legal
              variants:
                - {id: a, text: 'Primer LLC, OGRN 1000000000001, INN 7700000000', status: assumed, source: fact}
              chosen: a
              fact_ids: ['fact:company-name', 'fact:company-ogrn', 'fact:company-inn']
            - slot_id: privacy-label
              slot_type: nav-label
              variants:
                - {id: a, text: Personal data policy, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-1-label
              slot_type: nav-label
              site_slot_id: nav.label
              group: nav-1
              variants:
                - {id: a, text: Blog, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-2-label
              slot_type: nav-label
              site_slot_id: nav.label
              group: nav-2
              variants:
                - {id: a, text: About, status: assumed, source: ai-self}
              chosen: a
            - slot_id: nav-3-label
              slot_type: nav-label
              site_slot_id: nav.label
              group: nav-3
              variants:
                - {id: a, text: Contacts, status: assumed, source: ai-self}
              chosen: a
