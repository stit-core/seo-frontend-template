# План страницы «спасибо» проекта шаблона site-template — форма page-plan v1 базы strategy (kb/site/
# 10-playbooks-contracts/schemas/page-plan.schema.json): подтверждение заявки, канал для срочного вопроса.
page_plan_version: '1'
checked: '2026-10-16'
status: draft
site: site-template
refs:
  brief: ../site-brief.yaml
  facts: ../../../facts.yaml
  site_map: ../site-map.yaml
  copy_deck: ../copy/thank-you.yaml
  blocks: ../../../../../../.claude/skills/design-deep-dive/kb/site/04-blocks/blocks.yaml
  vocabulary: ../../../../../../.claude/skills/design-deep-dive/kb/site/02-site-types/vocabulary.yaml
  head_kit: ../../../../../../.claude/skills/design-deep-dive/kb/site/07-seo-geo-performance-analytics/head-kit.yaml
page:
  id: thank-you
  page_type: thank-you-page
  template: false
  template_id: thank-you
  url: /contacts/spasibo
  lang: ru
  locale: ru-RU
  jurisdiction:
    - ru
  goal: подтвердить заявку, сказать, что и когда будет, дать канал для срочного вопроса
  primary_action: lead-request
  cta_target:
    kind: route
    value: /contacts
  awareness: product-aware
  awareness_basis:
    from: assumption
    rule: уровень по главному источнику страницы — отправка формы контактов
  traffic:
    - traffic_source: internal
      temperature: hot
      device: mixed
  macrostructure: long-document
  macrostructure_family: document
  first_screen_policy: offer-cta
  budget_profile: thank-you-page@L0
  ambition_level: L0
  navigation:
    header: site
    archetype: bar-links
    logo_link: /
    breadcrumbs: false
    footer: site
  seo:
    indexable: false
    canonical: self
    h1: confirmation.title
    structured_data: []
    ssr_required: false
    sitemap: false
  legal:
    pd_consent: not-collected
    privacy_policy: /legal/privacy
    cookie_banner: not-needed
    cookie_mode: none
    analytics_before_consent: false
    requisites: footer
    operator_ref: fact:company-name
page_slots:
  text:
    - id: meta-title
      slot: meta-title
    - id: meta-description
      slot: meta-description
sections:
  - id: header
    role: header
    block: header
    variant: site-nav
    slots:
      text:
        - id: nav-link-1
          slot: nav-label
          anatomy: nav-link
        - id: nav-link-2
          slot: nav-label
          anatomy: nav-link
        - id: nav-link-3
          slot: nav-label
          anatomy: nav-link
      media:
        - id: logo
          slot: brand-logo
          media_role: informational
          goal: знак сайта — ссылка на главную
          source: code
          authenticity: code
      action:
        - id: lang-switch
          slot: link
          action: read-more
          style: link
  - id: confirmation
    role: confirmation
    question: заявка дошла? что дальше?
    job: статус первым, затем кто и когда ответит и одно следующее действие
    block: thank-you
    variant: page
    next_step: главное действие страницы
    slots:
      text:
        - id: title
          slot: form-success
          heading: h1
        - id: next-steps
          slot: form-next-steps
        - id: secondary-label
          slot: cta-secondary-label
      data:
        - id: response-time
          slot: fact-ref
          fact: fact:response-time
          binds:
            - next-steps
      action:
        - id: secondary
          slot: cta-secondary
          action: read-more
          style: secondary
          target:
            kind: route
            value: /contacts
          label: secondary-label
  - id: contacts
    role: contacts
    question: как связаться, если срочно
    job: часы работы, телефон и почта
    block: contact-details
    variant: compact
    next_step: главное действие страницы
    slots:
      text:
        - id: title
          slot: section-title
          heading: h2
        - id: info
          slot: contact-info
      data:
        - id: hours
          slot: fact-ref
          fact: fact:company-hours
          anatomy: company
          binds:
            - info
      action:
        - id: phone
          slot: phone-link
          action: call
          style: channel
          target:
            kind: tel
            value: tel:+74950000000
        - id: email
          slot: email-link
          action: message
          style: channel
          target:
            kind: url
            value: mailto:hello@example.com
  - id: footer
    role: footer
    block: footer
    variant: site
    slots:
      text:
        - id: legal
          slot: footer-legal
        - id: privacy-label
          slot: nav-label
        - id: nav-1-label
          slot: nav-label
          anatomy: nav.label
          group: nav-1
        - id: nav-2-label
          slot: nav-label
          anatomy: nav.label
          group: nav-2
        - id: nav-3-label
          slot: nav-label
          anatomy: nav.label
          group: nav-3
      data:
        - id: company
          slot: fact-ref
          fact: fact:company-name
          anatomy: company
          binds:
            - legal
      action:
        - id: privacy
          slot: link
          action: read-more
          style: link
          target:
            kind: route
            value: /legal/privacy
          label: privacy-label
        - id: email
          slot: email-link
          action: message
          style: channel
          target:
            kind: url
            value: mailto:hello@example.com
        - id: nav-1-link
          slot: link
          anatomy: nav.link
          group: nav-1
          action: read-more
          style: link
          target:
            kind: route
            value: /blog
          label: nav-1-label
        - id: nav-2-link
          slot: link
          anatomy: nav.link
          group: nav-2
          action: read-more
          style: link
          target:
            kind: route
            value: /about
          label: nav-2-label
        - id: nav-3-link
          slot: link
          anatomy: nav.link
          group: nav-3
          action: read-more
          style: link
          target:
            kind: route
            value: /contacts
          label: nav-3-label
