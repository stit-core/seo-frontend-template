          group: clause-1
        - id: clause-2-heading
          slot: article-heading
          anatomy: clause.heading
          group: clause-2
          heading: h2
        - id: clause-2-text-1
          slot: article-paragraph
          anatomy: clause.text
          group: clause-2
        - id: clause-2-text-2
          slot: article-paragraph
          anatomy: clause.text
          group: clause-2
        - id: clause-3-heading
          slot: article-heading
          anatomy: clause.heading
          group: clause-3
          heading: h2
        - id: clause-3-text-1
          slot: article-paragraph
          anatomy: clause.text
          group: clause-3
        - id: clause-4-heading
          slot: article-heading
          anatomy: clause.heading
          group: clause-4
          heading: h2
        - id: clause-4-text-1
          slot: article-paragraph
          anatomy: clause.text
          group: clause-4
        - id: clause-5-heading
          slot: article-heading
          anatomy: clause.heading
          group: clause-5
          heading: h2
        - id: clause-5-text-1
          slot: article-paragraph
          anatomy: clause.text
          group: clause-5
        - id: clause-6-heading
          slot: article-heading
          anatomy: clause.heading
          group: clause-6
          heading: h2
        - id: clause-6-text-1
          slot: article-paragraph
          anatomy: clause.text
          group: clause-6
        - id: clause-7-heading
          slot: article-heading
          anatomy: clause.heading
          group: clause-7
          heading: h2
        - id: clause-7-text-1
          slot: article-paragraph
          anatomy: clause.text
          group: clause-7
        - id: clause-8-heading
          slot: article-heading
          anatomy: clause.heading
          group: clause-8
          heading: h2
