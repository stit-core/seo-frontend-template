          slot: article-paragraph
          anatomy: clause.text
          group: clause-8
      data:
        - id: company
          slot: fact-ref
          fact: fact:company-name
          anatomy: company
          binds:
            - operator
        - id: revision
          slot: fact-ref
          fact: fact:policy-revision
          binds:
            - date
        - id: retention
          slot: fact-ref
          fact: fact:log-retention
          binds:
            - clause-5-text-1
        - id: deadline
          slot: fact-ref
          fact: fact:request-deadline
          binds:
            - clause-6-text-1
  - id: footer
    role: footer
    block: footer
    variant: site
    slots:
      text:
        - id: legal
          slot: footer-legal
        - id: privacy-label
          slot: nav-label
        - id: nav-1-label
          slot: nav-label
          anatomy: nav.label
          group: nav-1
        - id: nav-2-label
          slot: nav-label
          anatomy: nav.label
          group: nav-2
