# План политики обработки персональных данных проекта шаблона site-template — форма page-plan v1 базы strategy
# (kb/site/10-playbooks-contracts/schemas/page-plan.schema.json): документ — блок legal-text, оператор — факты.
page_plan_version: '1'
checked: '2026-10-16'
status: draft
site: site-template
refs:
  brief: ../site-brief.yaml
  facts: ../../../facts.yaml
  site_map: ../site-map.yaml
  copy_deck: ../copy/privacy.yaml
  blocks: ../../../../../../.claude/skills/design-deep-dive/kb/site/04-blocks/blocks.yaml
  vocabulary: ../../../../../../.claude/skills/design-deep-dive/kb/site/02-site-types/vocabulary.yaml
  head_kit: ../../../../../../.claude/skills/design-deep-dive/kb/site/07-seo-geo-performance-analytics/head-kit.yaml
page:
  id: privacy
  page_type: legal-page
  template: false
  template_id: legal
  url: /legal/privacy
  lang: ru
  locale: ru-RU
  jurisdiction:
    - ru
  goal: опубликовать политику обработки персональных данных с оператором и датой редакции
  primary_action: lead-request
  cta_target:
    kind: route
    value: /contacts
  awareness: product-aware
  awareness_basis:
    from: assumption
    rule: уровень по главному источнику страницы — ссылка из подвала и у согласия формы
  traffic:
    - traffic_source: internal
      temperature: warm
      device: mixed
  macrostructure: long-document
  macrostructure_family: document
  first_screen_policy: offer-cta-header
  budget_profile: legal-page@L0
  ambition_level: L0
  navigation:
    header: site
    archetype: bar-links
    logo_link: /
    breadcrumbs: false
    footer: site
  seo:
    indexable: true
    canonical: self
    h1: legal.title
    structured_data: []
    ssr_required: true
    sitemap: true
  legal:
    pd_consent: not-collected
    privacy_policy: /legal/privacy
    cookie_banner: not-needed
    cookie_mode: none
    analytics_before_consent: false
    requisites: both
    operator_ref: fact:company-name
page_slots:
  text:
    - id: meta-title
      slot: meta-title
    - id: meta-description
      slot: meta-description
sections:
  - id: header
    role: header
    block: header
    variant: site-nav
    slots:
      text:
        - id: nav-link-1
          slot: nav-label
          anatomy: nav-link
        - id: nav-link-2
          slot: nav-label
          anatomy: nav-link
        - id: nav-link-3
          slot: nav-label
          anatomy: nav-link
        - id: cta-label
          slot: cta-label
      media:
        - id: logo
          slot: brand-logo
          media_role: informational
          goal: знак сайта — ссылка на главную
          source: code
          authenticity: code
      action:
        - id: lang-switch
          slot: link
          action: read-more
          style: link
        - id: cta
          slot: cta-primary
          action: lead-request
          style: primary
          label: cta-label
          target:
            kind: route
            value: /contacts
  - id: legal
    role: legal
    question: кто обрабатывает мои данные и зачем
    job: политика обработки персональных данных — оператор, данные, цели, сроки, права
    block: legal-text
    variant: privacy-policy
    next_step: шапка и подвал сайта
    slots:
