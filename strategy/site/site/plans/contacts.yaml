# План страницы контактов проекта шаблона site-template — форма page-plan v1 базы strategy (kb/site/
# 10-playbooks-contracts/schemas/page-plan.schema.json): форма заявки без JavaScript и другие способы связи.
page_plan_version: '1'
checked: '2026-10-16'
status: draft
site: site-template
refs:
  brief: ../site-brief.yaml
  facts: ../../../facts.yaml
  site_map: ../site-map.yaml
  copy_deck: ../copy/contacts.yaml
  blocks: ../../../../../../.claude/skills/design-deep-dive/kb/site/04-blocks/blocks.yaml
  vocabulary: ../../../../../../.claude/skills/design-deep-dive/kb/site/02-site-types/vocabulary.yaml
  head_kit: ../../../../../../.claude/skills/design-deep-dive/kb/site/07-seo-geo-performance-analytics/head-kit.yaml
page:
  id: contacts
  page_type: contacts-page
  template: false
  template_id: contacts
  url: /contacts
  lang: ru
  locale: ru-RU
  jurisdiction:
    - ru
  goal: принять заявку через форму без JavaScript и дать другие способы связи
  primary_action: lead-request
  cta_target:
    kind: anchor
    value: '#lead-form'
  awareness: product-aware
  awareness_basis:
    from: assumption
    rule: уровень по главному источнику страницы — призыв главной и меню
  traffic:
    - traffic_source: internal
      temperature: hot
      device: mixed
    - traffic_source: search-brand
      temperature: hot
      device: mixed
  macrostructure: long-document
  macrostructure_family: document
  first_screen_policy: offer-cta
  budget_profile: contacts-page@L0
  ambition_level: L0
  navigation:
    header: site
    archetype: bar-links
    logo_link: /
    breadcrumbs: false
    footer: site
  seo:
    indexable: true
    canonical: self
    h1: hero.headline
    structured_data:
      - ContactPage
      - LocalBusiness
    ssr_required: true
    sitemap: true
  legal:
    pd_consent: checkbox-and-link
    privacy_policy: /legal/privacy
    cookie_banner: not-needed
    cookie_mode: none
    analytics_before_consent: false
    requisites: footer
    operator_ref: fact:company-name
page_slots:
  text:
    - id: meta-title
      slot: meta-title
    - id: meta-description
      slot: meta-description
sections:
  - id: header
    role: header
    block: header
    variant: site-nav
    slots:
      text:
        - id: nav-link-1
          slot: nav-label
          anatomy: nav-link
        - id: nav-link-2
          slot: nav-label
          anatomy: nav-link
        - id: nav-link-3
          slot: nav-label
          anatomy: nav-link
      media:
        - id: logo
          slot: brand-logo
          media_role: informational
          goal: знак сайта — ссылка на главную
          source: code
          authenticity: code
      action:
        - id: lang-switch
          slot: link
          action: read-more
          style: link
  - id: hero
    role: hero
    question: как с вами связаться
    job: назвать страницу и путь к форме заявки
    block: hero-text
    variant: statement-cta
    next_step: главное действие страницы
    slots:
      text:
        - id: headline
          slot: headline
          heading: h1
        - id: subheadline
          slot: subheadline
        - id: cta-label
          slot: cta-label
      action:
        - id: cta
          slot: cta-primary
          action: lead-request
          style: primary
          target:
            kind: anchor
            value: '#lead-form'
          label: cta-label
  - id: lead-form
    role: lead-form
    question: как оставить заявку
    job: форма заявки без JavaScript — имя, почта, задача и согласие на обработку ПДн
    block: lead-form
    variant: with-details
    next_step: главное действие страницы
    slots:
      text:
        - id: title
          slot: form-title
          heading: h2
        - id: lead
          slot: form-lead
        - id: cta-label
          slot: cta-label
        - id: consent
          slot: form-consent
        - id: next-steps
          slot: form-next-steps
        - id: success
          slot: form-success
      data:
        - id: response-time
          slot: fact-ref
          fact: fact:response-time
          binds:
            - next-steps
      action:
        - id: form
          slot: form
          action: message
          style: primary
          form:
            ref: lead-forms.yaml#contact-message
            consent: separate-checkbox
            marketing_consent: false
            success: thank-you-page
            thank_you_page: /contacts/spasibo
  - id: contacts
    role: contacts
    question: как связаться иначе
    job: адрес, часы работы, телефон и почта
    block: contact-details
    variant: compact
    next_step: главное действие страницы
    slots:
      text:
        - id: title
          slot: section-title
          heading: h2
        - id: info-1
          slot: contact-info
          anatomy: info
        - id: info-2
          slot: contact-info
          anatomy: info
      data:
        - id: address
          slot: fact-ref
          fact: fact:company-address
          anatomy: company
          binds:
            - info-1
        - id: hours
          slot: fact-ref
          fact: fact:company-hours
          anatomy: company
          binds:
            - info-2
      action:
        - id: phone
          slot: phone-link
          action: call
          style: channel
          target:
            kind: tel
            value: tel:+74950000000
        - id: email
          slot: email-link
          action: message
          style: channel
          target:
            kind: url
            value: mailto:hello@example.com
  - id: footer
    role: footer
    block: footer
    variant: site
    slots:
      text:
        - id: legal
          slot: footer-legal
        - id: privacy-label
          slot: nav-label
        - id: nav-1-label
          slot: nav-label
          anatomy: nav.label
          group: nav-1
        - id: nav-2-label
          slot: nav-label
          anatomy: nav.label
          group: nav-2
        - id: nav-3-label
          slot: nav-label
          anatomy: nav.label
          group: nav-3
      data:
        - id: company
          slot: fact-ref
          fact: fact:company-name
          anatomy: company
          binds:
            - legal
      action:
        - id: privacy
          slot: link
          action: read-more
          style: link
          target:
            kind: route
            value: /legal/privacy
          label: privacy-label
        - id: email
          slot: email-link
          action: message
          style: channel
          target:
            kind: url
            value: mailto:hello@example.com
        - id: nav-1-link
          slot: link
          anatomy: nav.link
          group: nav-1
          action: read-more
          style: link
          target:
            kind: route
            value: /blog
          label: nav-1-label
        - id: nav-2-link
          slot: link
          anatomy: nav.link
          group: nav-2
          action: read-more
          style: link
          target:
            kind: route
            value: /about
          label: nav-2-label
        - id: nav-3-link
          slot: link
          anatomy: nav.link
          group: nav-3
          action: read-more
          style: link
          target:
            kind: route
            value: /contacts
          label: nav-3-label
