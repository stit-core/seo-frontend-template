# План шаблона записи блога проекта шаблона site-template — форма page-plan v1 базы strategy (kb/site/10-
# playbooks-contracts/schemas/page-plan.schema.json): шаблон коллекции posts карты — тексты шаблона в copy deck,
# слоты записи (заголовок, лид, дата, автор, обложка, текущая крошка) — поля записи.
page_plan_version: '1'
checked: '2026-10-16'
status: draft
site: site-template
refs:
  brief: ../site-brief.yaml
  facts: ../../../facts.yaml
  site_map: ../site-map.yaml
  copy_deck: ../copy/post.yaml
  blocks: ../../../../../../.claude/skills/design-deep-dive/kb/site/04-blocks/blocks.yaml
  vocabulary: ../../../../../../.claude/skills/design-deep-dive/kb/site/02-site-types/vocabulary.yaml
  head_kit: ../../../../../../.claude/skills/design-deep-dive/kb/site/07-seo-geo-performance-analytics/head-kit.yaml
page:
  id: post
  page_type: article-page
  template: true
  template_id: post
  url: /blog/{slug}
  lang: ru
  locale: ru-RU
  jurisdiction:
    - ru
  goal: дать ответ заметки, её автора и дату, путь к связанным заметкам
  primary_action: lead-request
  cta_target:
    kind: route
    value: /contacts
  awareness: solution-aware
  awareness_basis:
    from: assumption
    rule: уровень по главному источнику страницы — поиск по задаче и переход из блога
  traffic:
    - traffic_source: search-category
      temperature: warm
      device: mixed
    - traffic_source: internal
      temperature: warm
      device: mixed
  macrostructure: long-document
  macrostructure_family: document
  first_screen_policy: poster
  budget_profile: article-page@L0
  ambition_level: L0
  navigation:
    header: site
    archetype: bar-links
    logo_link: /
    breadcrumbs: true
    footer: site
  seo:
    indexable: true
    canonical: self
    h1: article-body.title
    structured_data:
      - Article
      - BreadcrumbList
    ssr_required: true
    sitemap: true
  legal:
    pd_consent: not-collected
    privacy_policy: /legal/privacy
    cookie_banner: not-needed
    cookie_mode: none
    analytics_before_consent: false
    requisites: footer
    operator_ref: fact:company-name
page_slots:
  text:
    - id: meta-title
      slot: meta-title
    - id: meta-description
      slot: meta-description
sections:
  - id: header
    role: header
    block: header
    variant: site-nav
    slots:
      text:
        - id: nav-link-1
          slot: nav-label
          anatomy: nav-link
        - id: nav-link-2
          slot: nav-label
          anatomy: nav-link
        - id: nav-link-3
          slot: nav-label
          anatomy: nav-link
      media:
        - id: logo
          slot: brand-logo
          media_role: informational
          goal: знак сайта — ссылка на главную
          source: code
          authenticity: code
      action:
        - id: lang-switch
          slot: link
          action: read-more
          style: link
  - id: breadcrumbs
    role: header
    question: где я
    job: путь наверх по карте — главная и блог; текущая ступень — сама страница
    block: breadcrumbs
    variant: full-path
    next_step: шапка и подвал сайта
    slots:
      text:
        - id: current
          slot: nav-label
        - id: crumb-1-label
          slot: nav-label
          anatomy: crumb.label
          group: crumb-1
        - id: crumb-2-label
          slot: nav-label
          anatomy: crumb.label
          group: crumb-2
      action:
        - id: crumb-1-link
          slot: link
          anatomy: crumb.link
          group: crumb-1
          action: read-more
          style: link
          target:
            kind: route
            value: /
        - id: crumb-2-link
          slot: link
          anatomy: crumb.link
          group: crumb-2
          action: read-more
          style: link
          target:
            kind: route
            value: /blog
  - id: article-body
    role: article-body
    question: что в заметке
    job: заголовок, лид, автор и даты записи, обложка и её текст — поля записи коллекции posts
    block: article-body
    variant: longread
    next_step: связанные заметки
    slots:
      text:
        - id: title
          slot: article-title
          heading: h1
        - id: lead
          slot: article-lead
        - id: date
          slot: article-date
        - id: author
          slot: article-author
        - id: alt
          slot: image-alt
      media:
        - id: cover
          slot: cover-image
          media_role: informational
          goal: обложка записи — мастер 1600×900 её коллекции
          alt: alt
  - id: related
    role: related
    question: что почитать дальше
    job: записи той же локали с общими тегами — правило карты post-tags
    block: related-links
    variant: list
    next_step: связанные заметки
    slots:
      text:
        - id: title
          slot: section-title
          heading: h2
  - id: footer
    role: footer
    block: footer
    variant: site
    slots:
      text:
        - id: legal
          slot: footer-legal
        - id: privacy-label
          slot: nav-label
        - id: nav-1-label
          slot: nav-label
          anatomy: nav.label
          group: nav-1
        - id: nav-2-label
          slot: nav-label
          anatomy: nav.label
          group: nav-2
        - id: nav-3-label
          slot: nav-label
          anatomy: nav.label
          group: nav-3
      data:
        - id: company
          slot: fact-ref
          fact: fact:company-name
          anatomy: company
          binds:
            - legal
      action:
        - id: privacy
          slot: link
          action: read-more
          style: link
          target:
            kind: route
            value: /legal/privacy
          label: privacy-label
        - id: email
          slot: email-link
          action: message
          style: channel
          target:
            kind: url
            value: mailto:hello@example.com
        - id: nav-1-link
          slot: link
          anatomy: nav.link
          group: nav-1
          action: read-more
          style: link
          target:
            kind: route
            value: /blog
          label: nav-1-label
        - id: nav-2-link
          slot: link
          anatomy: nav.link
          group: nav-2
          action: read-more
          style: link
          target:
            kind: route
            value: /about
          label: nav-2-label
        - id: nav-3-link
          slot: link
          anatomy: nav.link
          group: nav-3
          action: read-more
          style: link
          target:
            kind: route
            value: /contacts
          label: nav-3-label
