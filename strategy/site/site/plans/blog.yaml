# План списка блога проекта шаблона site-template — форма page-plan v1 базы strategy (kb/site/10-playbooks-
# contracts/schemas/page-plan.schema.json): секции — блоки каталога в порядке страницы, тексты слотов — copy deck
# страницы, записи — коллекция posts карты от новых к старым.
page_plan_version: '1'
checked: '2026-10-16'
status: draft
site: site-template
refs:
  brief: ../site-brief.yaml
  facts: ../../../facts.yaml
  site_map: ../site-map.yaml
  copy_deck: ../copy/blog.yaml
  blocks: ../../../../../../.claude/skills/design-deep-dive/kb/site/04-blocks/blocks.yaml
  vocabulary: ../../../../../../.claude/skills/design-deep-dive/kb/site/02-site-types/vocabulary.yaml
  head_kit: ../../../../../../.claude/skills/design-deep-dive/kb/site/07-seo-geo-performance-analytics/head-kit.yaml
page:
  id: blog
  page_type: blog-index-page
  template: false
  template_id: blog
  url: /blog
  lang: ru
  locale: ru-RU
  jurisdiction:
    - ru
  goal: показать заметки блога от новых к старым и дать путь к заявке
  primary_action: lead-request
  cta_target:
    kind: route
    value: /contacts
  awareness: solution-aware
  awareness_basis:
    from: assumption
    rule: уровень по главному источнику страницы — поиск по задаче и переход из блога
  traffic:
    - traffic_source: search-category
      temperature: warm
      device: mixed
    - traffic_source: internal
      temperature: warm
      device: mixed
  macrostructure: long-document
  macrostructure_family: document
  first_screen_policy: offer-cta
  budget_profile: blog-index-page@L0
  ambition_level: L0
  navigation:
    header: site
    archetype: bar-links
    logo_link: /
    breadcrumbs: false
    footer: site
  seo:
    indexable: true
    canonical: self
    h1: hero.headline
    structured_data:
      - CollectionPage
    ssr_required: true
    sitemap: true
  legal:
    pd_consent: not-collected
    privacy_policy: /legal/privacy
    cookie_banner: not-needed
    cookie_mode: none
    analytics_before_consent: false
    requisites: footer
    operator_ref: fact:company-name
page_slots:
  text:
    - id: meta-title
      slot: meta-title
    - id: meta-description
      slot: meta-description
sections:
  - id: header
    role: header
    block: header
    variant: site-nav
    slots:
      text:
        - id: nav-link-1
          slot: nav-label
          anatomy: nav-link
        - id: nav-link-2
          slot: nav-label
          anatomy: nav-link
        - id: nav-link-3
          slot: nav-label
          anatomy: nav-link
      media:
        - id: logo
          slot: brand-logo
          media_role: informational
          goal: знак сайта — ссылка на главную
          source: code
          authenticity: code
      action:
        - id: lang-switch
          slot: link
          action: read-more
          style: link
  - id: hero
    role: hero
    question: о чём блог
    job: назвать тему заметок и дать путь к заявке
    block: hero-text
    variant: statement-cta
    next_step: главное действие страницы
    slots:
      text:
        - id: headline
          slot: headline
          heading: h1
        - id: subheadline
          slot: subheadline
        - id: cta-label
          slot: cta-label
      action:
        - id: cta
          slot: cta-primary
          action: lead-request
          style: primary
          target:
            kind: route
            value: /contacts
          label: cta-label
  - id: related
    role: related
    question: что почитать
    job: все записи блога от новых к старым, по страницам
    block: article-cards
    variant: list
    next_step: записи блога
    slots:
      text:
        - id: title
          slot: section-title
          heading: h2
  - id: footer
    role: footer
    block: footer
    variant: site
    slots:
      text:
        - id: legal
          slot: footer-legal
        - id: privacy-label
          slot: nav-label
        - id: nav-1-label
          slot: nav-label
          anatomy: nav.label
          group: nav-1
        - id: nav-2-label
          slot: nav-label
          anatomy: nav.label
          group: nav-2
        - id: nav-3-label
          slot: nav-label
          anatomy: nav.label
          group: nav-3
      data:
        - id: company
          slot: fact-ref
          fact: fact:company-name
          anatomy: company
          binds:
            - legal
      action:
        - id: privacy
          slot: link
          action: read-more
          style: link
          target:
            kind: route
            value: /legal/privacy
          label: privacy-label
        - id: email
          slot: email-link
          action: message
          style: channel
          target:
            kind: url
            value: mailto:hello@example.com
        - id: nav-1-link
          slot: link
          anatomy: nav.link
          group: nav-1
          action: read-more
          style: link
          target:
            kind: route
            value: /blog
          label: nav-1-label
        - id: nav-2-link
          slot: link
          anatomy: nav.link
          group: nav-2
          action: read-more
          style: link
          target:
            kind: route
            value: /about
          label: nav-2-label
        - id: nav-3-link
          slot: link
          anatomy: nav.link
          group: nav-3
          action: read-more
          style: link
          target:
            kind: route
            value: /contacts
          label: nav-3-label
