# Факты проекта шаблона site-template — форма facts.schema.yaml базы strategy (facts_version 1). Оператор сайта и его
# реквизиты вымышлены (example: true): форк заменяет их своими фактами, публикация с ними закрыта воротами strategy.
facts_version: 1
date: '2026-10-14'
site: site-template
lang: ru
jurisdiction: ru
status: draft
owner: {role: владелец шаблона, contact: репозиторий шаблона}
collected_by: исполнитель шаблона по README и коду репозитория
never_claim_defaults: ru-default-1

entities:
  - {id: product-template, type: product, names: [ssr-frontend-template, шаблон индексируемого сайта]}
  - {id: company-primer, type: company, names: [ООО «Пример», «Пример»]}
  - {id: city-moscow, type: place, names: [Москва, Москве]}
  - {id: tech-astro, type: other, names: [Astro]}
  - {id: tech-node, type: other, names: [Node.js, Node]}
  - {id: tech-docker, type: other, names: [Docker]}
  - {id: tech-javascript, type: other, names: [JavaScript]}
  - {id: tech-html, type: other, names: [HTML]}
  - {id: tech-json-ld, type: other, names: [JSON-LD]}
  - {id: tech-markdown, type: other, names: [Markdown]}
  - {id: tech-eslint, type: other, names: [ESLint]}
  - {id: tech-steiger, type: other, names: [Steiger]}
  - {id: tech-fsd, type: other, names: [Feature-Sliced Design]}

facts:
  - id: company-name
    kind: company
    claim_class: [company-details]
    verbatim:
      - ООО «Пример»
    canonical: Оператор сайта — ООО «Пример».
    entities: [company-primer]
    source: {type: customer-document, who: владелец шаблона, where: демо-реквизиты шаблона, date: '2026-10-14', derivation: direct}
    verification: {status: stated}
    permission: {status: not-required}
    use: {any: true}
    example: true
    lang: ru

  - id: company-ogrn
    kind: company
    claim_class: [company-details]
    verbatim:
      - ОГРН 1000000000001
    canonical: 'ООО «Пример»: ОГРН 1000000000001.'
