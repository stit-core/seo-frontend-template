# <<< text_slot_defaults

blocks:

  # =========================================================================================================== header-nav
  header:
    family: header-nav
    name: "Шапка"
    status: active
    flow: chrome
    purpose: "Опознать сайт и дать главный путь без прокрутки: логотип → главная, меню или только призыв и контакт"
    serves: [header]
    use_when: ["всегда: конвенция «логотип слева → главная, навигация сверху»"]
    avoid_when: ["меню сайта на посадочной под платный трафик — вариант landing-minimal (site 03/02 §2.3)", "нижняя панель вкладок как в приложении"]
    page_types: [landing-lead-services, landing-saas, home-multipage, service-page]
    html: {element: header, landmark: banner, list: ul, note: "меню — <nav aria-label=«Основное меню»>; H1 не в шапке; кнопка меню телефона — <button aria-expanded aria-controls>"}
    slots:
      - {id: logo, slot: brand-logo, required: true, html: a, note: "ссылка на /; alt — название бренда"}
      - {id: nav-link, slot: nav-label, required: by-variant, min: 0, max: 7, html: a, variants: [site-nav, transparent-over-hero]}
      - {id: cta, slot: cta-primary, required: false, html: a, note: "главный призыв страницы; на посадочной — обязательно при политике offer-cta-header и poster"}
      - {id: cta-label, slot: cta-label, required: false}
      - {id: phone, slot: phone-link, required: if-available, note: "ЛУ: телефон — канал целевого действия, а не выход"}
      - {id: messenger, slot: messenger-link, required: false}
      - {id: messenger-prefill, slot: messenger-prefill, required: false, purpose: "готовое первое сообщение мессенджера: на слот ссылается target.prefill действия с целью-мессенджером"}
      - {id: login, slot: link, required: false, note: "«Войти» — action log-in (micro), не главный призыв"}
      - {id: lang-switch, slot: link, required: false, note: "переключатель языка — site 06; hreflang — site 07"}
    variants:
      - {id: landing-minimal, name: "Логотип + призыв + контакт", when: "посадочная под платный трафик (paid-search, paid-social, retargeting, email): меню сайта убрано, якоря и телефон остаются", default: true, drops: [nav-link], sources: ["site 03/02 §2.3 [спорно]"]}
      - {id: site-nav, name: "Шапка сайта с меню", when: "страница внутри многостраничника; архетип (N1b, N5, N6, N9, N11, N12 …) выбирает G по типу сайта", hallmark: [N1b, N5, N6, N9, N11, N12, N13], note: "архетип — site-map.chrome.header.archetype (перечисление site-map.schema.json v1 #/$defs/header-archetype, site 06/02 §1.2); план страницы только выбирает вариант (page.navigation). N1a «логотип + ряд ссылок + кнопка справа» по привычке — ИИ-отпечаток (гейт 42 Hallmark)"}
      - {id: transparent-over-hero, name: "Прозрачная поверх hero", when: "hero-media на всю ширину; контраст текста шапки ≥ 4,5:1 к кадру; после начала прокрутки — непрозрачная", sources: ["site 03/03 §4.1"]}
    mobile: {behavior: [stack], below_60rem: "меню → кнопка «Меню» с полноэкранным списком; призыв и (ЛУ) телефон остаются видимыми", below_40rem: "высота ≤ 64 px; логотип + кнопка меню + призыв или телефон", never_hide: [logo, cta], sticky: "липкая или частично липкая (появляется при прокрутке вверх); липкие слои вместе ≤ 20 % высоты экрана телефона; scroll-padding-top на высоту шапки (WCAG 2.4.11)"}
    refs: {structure: ["site:03-03#4.1", "site:03-03#4.2", "site:03-02#2.3"], ia: ["site:06-02"], conversion: ["site:05-01"], a11y: ["ux:02-02#7", "ux:02-02#8.2", "site:08-03"], events: ["site:07-04"], ux: ["ux:02-02#1.2", "ux:02-02#12.4"], creative: ["creative:block-treatments"]}
