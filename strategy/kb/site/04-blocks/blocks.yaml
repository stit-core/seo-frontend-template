# blocks.yaml — каталог блоков сайта: анатомия, слоты, структурные варианты, телефон, разметка, ссылки на правила
# владельцев. Схема — ../10-playbooks-contracts/schemas/blocks.schema.json.
#
# Как читать. Ключ — id блока словаря (02-site-types/vocabulary.yaml, пространство block). Блок = назначение + набор слотов;
# раскладка той же анатомии — структурный вариант (variants); визуальные варианты и эффекты — creative по id блока
# (block-treatments.yaml); правила текста слотов — text (copy-slots.yaml) по id слота (copy-rule:<slot>); медиа —
# ai-media (план ассетов 01/01 §8, коды task:); 3D — blender (recipe:). Элемент анатомии: id — локальный в блоке (= site_slot_id
# copy-deck и site_slot copy-slots.yaml text), slot — id словаря. required: true | false | if-fact (только при факте) |
# if-available (при наличии у заказчика) | by-variant (задаёт вариант). Длина текстового слота — класс порядка величины
# (length_classes), по умолчанию из text_slot_defaults (выведено скриптом из copy-slots.yaml).
# Ссылки на правила (refs): site:<папка>-<файл>#§, соседи — <база>:<папка>-<файл>#§; ссылка без § — на файл целиком.
# Адреса в заметках: «site 05» — раздел базы site (05-conversion-funnels), «site 03/02 §2.3» — папка, файл и раздел статьи.
# Проверка (от корня скилла): scripts/site/site_validate.py --all — схема и связи каталога (коды BL-*);
# scripts/site/vocab_lint.py kb/site/04-blocks/blocks.yaml --keys-as-ids blocks=block — id словаря.

blocks_version: "1.0"
checked: "2026-09-24"
status: v1
schema: ../10-playbooks-contracts/schemas/blocks.schema.json
vocabulary: {ref: ../02-site-types/vocabulary.yaml, version: 1, revision: 1, checked: "2026-09-24"}

conventions:
  - {id: dom-order, rule: "Визуальный порядок секций = порядок DOM на всех экранах; секции не переставлять CSS (order, row-reverse, grid-area); внутри ряда «текст ↔ медиа» сторона медиа меняется колонкой сетки при неизменном DOM «текст → медиа»", label: "[стандарт] WCAG 1.3.2, 2.4.3", ref: "site:03-03#5.1"}
  - {id: one-h1, rule: "Один H1 на странице — в hero (слот headline) или article-title; секции — H2 (section-title), карточки и шаги — H3; уровни не пропускать", label: "[практика] + [стандарт] WCAG 1.3.1", ref: "site:07-01"}
  - {id: landmarks, rule: "<header> (banner) — только шапка сайта; hero и секции — <section> внутри <main> с aria-labelledby на свой заголовок; <footer> (contentinfo) — подвал; H1 не в шапке", label: "[практика]", ref: "site:08-03"}
  - {id: logo-home, rule: "Логотип слева ведёт на главную на всех страницах, включая посадочные без меню", label: "[исследование] ux 02-02 §7", ref: "ux:02-02#7"}
  - {id: no-fact-no-block, rule: "Число, отзыв, логотип клиента, награда, рейтинг, цена, срок акции, человек на фото — только из facts.yaml (data-слот fact:<id>); блок с requires_facts без фактов не строится, а не заполняется выдумкой", label: "[контракт §3 п.10]", ref: "site:08-02"}
  - {id: cta-repeat, rule: "Одно главное действие на страницу, но его призыв повторяется: шапка, hero, после доказательств, финал, липкий на телефоне; второй путь — иным стилем (style: secondary)", label: "[консенсус]", ref: "site:05-01"}
  - {id: collapse-not-cut, rule: "На телефоне детали сворачиваются (accordion), сетки — в колонку (stack), ленты — с видимым краем (rail); смысловой текст, цены, условия, доказательства и призыв не убираются", label: "[документация] Google mobile-first; [исследование] ux 09-03 §7", ref: "site:03-03#5.2"}
  - {id: breakpoints, rule: "Две границы: 60rem (~960 px) — раскладка: сетки в колонку, наклоны и обрезки снимаются, липкие панели отлипают; 40rem (~640 px) — типографика и плотность: дисплей на шаг меньше, метки полей в строку, аннотации — легендой", label: "[мнение вендора] Hallmark component-cookbook"}
  - {id: target-size, rule: "Цель ≥ 24 × 24 CSS px или с зазором (WCAG 2.2 AA 2.5.8); на таче каждая цель ≥ 44 × 44 зоной нажатия, видимый контрол может быть меньше (2.5.5 AAA, Apple HIG); Hallmark ошибочно называет 44 px уровнем AA", label: "[стандарт]", ref: "site:08-03"}
  - {id: html-first, rule: "Смысловой текст, цены, условия, ответы FAQ, призывы и ссылки — в исходном HTML до скриптов и эффектов; ИИ-краулеры JS не исполняют", label: "[документация]", ref: "site:07-02"}
  - {id: motion-pause, rule: "Автодвижение дольше 5 с (карусель, бегущая строка, видео-петля, шейдер) — с паузой; карусели не прокручиваются сами по умолчанию; prefers-reduced-motion — статичный кадр", label: "[стандарт] WCAG 2.2.2, 2.3.3", ref: "site:08-03"}
  - {id: lcp-eager, rule: "Кандидат LCP (H1 или главный визуал hero) не грузится лениво; медиа ниже первого экрана — loading=lazy; 3D и видео — после LCP с постером", label: "[документация] web.dev", ref: "site:07-03"}
  - {id: vary-blocks, rule: "На одной странице две секции не повторяют один блок в одном варианте (исключения — cta-band и формы-повторы призыва); хвост страницы выводится из возражений, а не «фичи → 3 отзыва → 3 тарифа → лозунг»", label: "[мнение вендора] Hallmark; [проверено]", ref: "site:03-01#3.4"}
  - {id: treatment-elsewhere, rule: "Композиция, типографика, цвет, фон, движение и эффекты блока — creative по id блока; site задаёт анатомию, порядок и ограничения (ворота)", label: "[контракт §2]"}

length_classes:
  label: "1–3 слова: кнопка, пункт меню, бирка, число"
  phrase: "4–10 слов: заголовок, подпись, строка у кнопки"
  sentence: "11–25 слов: лид, подзаголовок, ответ одной-двумя фразами"
  paragraph: "26–80 слов: абзац, отзыв, описание кейса, ответ для ИИ"
  long: "больше 80 слов: письмо, статья, юридический текст"

mobile_behaviors:
  stack: "Одна колонка; порядок элементов внутри секции по разметке; тарифы — не больше двух рядом"
  accordion: "Детали свёрнуты (FAQ, характеристики, программа, длинные перечни): первый пункт не раскрыт, заголовок пункта — кнопка"
  rail: "Горизонтальная лента с видимым краем следующей карточки и кнопками «назад/вперёд»; важное в ленту не прятать"
  hide-decor: "Декоративное медиа убрать или заменить лёгким кадром; информационное — оставить"
  reframe: "Отдельный кадр медиа для телефона (4:5 или 9:16) со своей композицией; видео — только вертикальный файл"
  toggle: "Таблица сравнения: две колонки и переключатель альтернатив или карточки по альтернативе"
  none: "Без изменений кроме переноса строк (блок уже узкий)"

