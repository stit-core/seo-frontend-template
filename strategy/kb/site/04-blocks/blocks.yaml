    use_when: ["нижняя треть страницы (site 03/01: позиция 0,90)", "objections: 1–3 блокирующих вопроса рядом с призывом"]
    avoid_when: ["главное возражение-блокер спрятано в FAQ внизу", "вопросы «Почему мы?» для рекламы себя"]
