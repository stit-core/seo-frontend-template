    variants:
      - {id: accordion, name: "Аккордеон", when: "по умолчанию", default: true}
      - {id: open-list, name: "Открытый список", when: "≤ 5 вопросов; ответы видны сразу (удобно для ИИ-цитирования)"}
      - {id: objections-near-cta, name: "Возражения у призыва", when: "1–3 блокирующих вопроса до формы (роль objections)"}
      - {id: grouped, name: "По темам", when: "страница вопросов многостраничника"}
    mobile: {behavior: [accordion], below_40rem: "первый пункт не раскрыт; вопрос — вся строка нажатия", never_hide: [qa.q, qa.a]}
    refs: {structure: ["site:03-01#1.2"], seo: ["site:07-01", "site:07-02"], a11y: ["ux:02-02#6", "site:08-03"], ux: ["ux:09-03#7.2"], text: ["copy-rule:faq-q", "copy-rule:faq-a"], creative: ["creative:block-treatments"]}
    errors: ["Ответ начинается с «Отличный вопрос!»", "FAQ из 20 вопросов вместо ответов в тексте страницы", "Ответы подгружаются скриптом"]
