    use_when: ["страница длиннее 3 экранов — повтор призыва каждые 2–3 экрана (site 03/02 §1.4)", "финал: повтор главного обещания"]
    avoid_when: ["полоса после каждой секции", "главное действие — форма: тогда lead-form"]
