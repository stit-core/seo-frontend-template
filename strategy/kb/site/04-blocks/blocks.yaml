    slots:
      - {id: title, slot: section-title, required: true, heading: h2}
      - {id: lead, slot: section-lead, required: false}
      - {id: cta, slot: cta-primary, required: true}
      - {id: cta-label, slot: cta-label, required: true}
      - {id: cta-secondary, slot: cta-secondary, required: false}
      - {id: cta-secondary-label, slot: cta-secondary-label, required: false}
      - {id: cta-note, slot: cta-note, required: false}
      - {id: phone, slot: phone-link, required: false, variants: [final-with-channels]}
      - {id: messenger, slot: messenger-link, required: false, variants: [final-with-channels]}
      - {id: messenger-prefill, slot: messenger-prefill, required: false, purpose: "готовое первое сообщение мессенджера: на слот ссылается target.prefill действия с целью-мессенджером"}
      - {id: proof, slot: fact-ref, required: false}
    variants:
      - {id: mid, name: "Промежуточная", when: "после доказательств или цены", default: true}
      - {id: final, name: "Финальная", when: "последняя секция перед подвалом"}
      - {id: final-with-channels, name: "Финальная с каналами", when: "ЛУ: кнопка + телефон + мессенджер"}
    mobile: {behavior: [stack], below_40rem: "кнопка на всю ширину", never_hide: [cta]}
    refs: {conversion: ["site:05-01"], events: ["site:07-04"], text: ["text:04-01"], assets: ["ai-media:01-01#2.6"], creative: ["creative:block-treatments"]}
    errors: ["Полоса «Готовы начать?» без нового довода", "Две равные кнопки разных действий"]
    evidence: ["cta-band — 4 из 30, final-cta — 12 из 30 живых страниц [проверено]"]

  sticky-cta:
    family: cta
    name: "Липкая панель призыва"
    status: active
    flow: overlay
    purpose: "Главный призыв, закреплённый при прокрутке — обычно внизу экрана телефона"
    serves: [cta-band]
    use_when: ["страница длиннее 3 экранов телефона и у неё одно главное действие (site 03/03 §4.3)"]
    avoid_when: ["липкие слои вместе > 20 % высоты экрана", "одновременно с видимым призывом hero или формы — прятать"]
    html: {element: div, landmark: none, note: "position: fixed; padding-bottom: env(safe-area-inset-bottom); scroll-padding-bottom у html на её высоту (WCAG 2.4.11)"}
    slots:
      - {id: cta, slot: cta-primary, required: true}
      - {id: cta-label, slot: cta-label, required: true}
      - {id: messenger-prefill, slot: messenger-prefill, required: false, purpose: "готовое первое сообщение мессенджера: на слот ссылается target.prefill действия с целью-мессенджером"}
      - {id: cta-note, slot: cta-note, required: false, length: phrase}
      - {id: phone, slot: phone-link, required: false}
    variants:
      - {id: bottom-bar, name: "Панель внизу", when: "телефон", default: true, hallmark: [C4]}
      - {id: top-on-scroll, name: "Панель сверху после hero", when: "десктоп, длинная страница"}
    mobile: {behavior: [none], below_40rem: "≤ 72 px + safe area; скрыта при видимом призыве hero, форме, финальном призыве и открытой клавиатуре", never_hide: [cta]}
    refs: {structure: ["site:03-03#4.3"], conversion: ["site:05-01"], a11y: ["site:08-03"], ux: ["ux:09-02#3.3", "ux:09-04#4.14"], creative: ["creative:block-treatments"]}
    errors: ["Панель перекрывает кнопку «Отправить» и поле в фокусе", "Липкая панель + плавающие мессенджеры + баннер cookie одновременно"]

  capture-popup:
    family: cta
    name: "Всплывающее окно захвата"
    status: off-by-default
    flow: overlay
    purpose: "Окно с формой — только по действию посетителя; по таймеру, прокрутке или уходу — выключено по умолчанию"
    serves: [utility, lead-form]
    use_when: ["открытие по нажатию посетителя (кнопка «Получить расчёт»)", "автопоказ — только по условиям site 05 с доказательствами и решением заказчика"]
    avoid_when: ["при входе на посадочную", "exit-intent и таймер по умолчанию", "платный трафик — проверить правила рекламных систем (site 05, site 07)"]
    html: {element: dialog, landmark: dialog, form: true, note: "<dialog> модальный: фокус внутрь, Esc закрывает, фокус возвращается на кнопку-источник; кнопка закрытия с доступным именем"}
    slots:
      - {id: title, slot: form-title, required: true, heading: h2}
      - {id: lead, slot: form-lead, required: true, purpose: "явный обмен: что получит человек"}
      - {id: form, slot: form, required: true}
      - {id: cta-label, slot: cta-label, required: true}
      - {id: consent, slot: form-consent, required: true}
    variants:
      - {id: on-click, name: "По нажатию", when: "единственный вариант по умолчанию", default: true}
      - {id: timed, name: "По таймеру", when: "выключен"}
      - {id: exit-intent, name: "При уходе", when: "выключен"}
      - {id: engaged-slide-in, name: "Карточка после вовлечения", when: "выключен по умолчанию; только policies.capture_popup: engaged брифа с rationale: немодальная, в углу, ≤ 25 % высоты экрана телефона, после ≥ 60 % прокрутки статьи или ключевой секции (не по таймеру), одна за визит, после закрытия не показывать ≥ 30 дней; не на посадочной под платный трафик (site 05/01 §11)", avoid: "страница под Директ и другой платный трафик; модальный вид"}
    mobile: {behavior: [none], below_40rem: "на весь экран с видимой кнопкой закрытия; без двойного закрытия", never_hide: [form]}
    refs: {conversion: ["site:05-01"], seo: ["site:07-01"], legal: ["site:08-02"], ux: ["ux:01-01#14.4", "ux:06-04#8.1", "ux:04-07"], creative: ["creative:block-treatments"]}
    errors: ["Окно при входе закрывает всю страницу (site 03/03: 1 из 27)", "«Нет, я не хочу экономить» — конфирмшейминг (ux 06-04)"]

