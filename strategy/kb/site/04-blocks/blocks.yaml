    slots:
      - {id: title, slot: section-title, required: true, heading: h2}
      - {id: cta, slot: cta-primary, required: false}
      - {id: cta-label, slot: cta-label, required: false}
      - {id: messenger-prefill, slot: messenger-prefill, required: false, purpose: "готовое первое сообщение мессенджера: на слот ссылается target.prefill действия с целью-мессенджером"}
      - {id: more, slot: link, required: false, purpose: "на страницу вопросов (многостраничник)"}
      - {id: more-label, slot: cta-secondary-label, required: false, purpose: "подпись ссылки more — называет, что откроется: страница вопросов"}
    groups:
