# Редиректы как данные: применяет сервер (app/middleware) одним хопом, проверяет
# `pnpm check:content`. Поля: from (корневой путь), to (корневой путь или абсолютный
# http(s) URL; у 410 нет), status (301 | 308 | 410), note (необязательно).
# Демо-записи шаблона — заменить своими.

- from: /old
  to: /blog
  status: 301
  note: демо — переезд раздела

- from: /blog/staraya-zametka
  status: 410
  note: демо — запись удалена навсегда
