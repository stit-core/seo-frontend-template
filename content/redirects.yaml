# Адреса как данные: применяет сервер одним хопом (обёртка процесса и app/middleware — одной
# таблицей), проверяет `pnpm check:content`. Поля: from, to (свой корневой путь или абсолютный
# http(s) URL; у 410 нет), status (301 | 308 | 410), note (необязательно).
# from — адрес старого сайта как он был: заглавные, кириллица, хвостовой слеш, `?query` (правило
# срабатывает, когда в запросе есть все его пары; прочие параметры переезжают в Location).
# Демо-записи шаблона — заменить своими.

- from: /old
  to: /blog
  status: 301
  note: демо — переезд раздела

- from: /?p=123
  to: /about
  status: 301
  note: демо — страница старого сайта по параметру

- from: /Услуги/
  to: /contacts
  status: 301
  note: демо — кириллица, заглавная и хвостовой слеш старого адреса

- from: /blog/staraya-zametka
  status: 410
  note: демо — запись удалена навсегда

- from: /en/blog/old-note
  status: 410
  note: демо — удалённая запись английской версии
